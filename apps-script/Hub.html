<!DOCTYPE html>
<html lang="en">
<head><base target="_top"><meta charset="utf-8"><?!= include('Styles') ?></head>
<body>
<header>
  <?!= include('Logo') ?>
  <div><h1>PO <span>Hub</span></h1><div class="hsub">Every PO, every document, every department · pilot</div></div>
  <div class="who"><a class="btn ghost" id="tplview" href="#" target="_blank" rel="noopener" style="display:none;min-height:36px;padding:4px 12px;font-size:13px;text-decoration:none">👁 See the 3PL view</a><div class="nm"><div id="uname" style="font-weight:500"></div><div class="hsub">Tootsi Impex</div></div></div>
</header>
<main id="main"><div class="loading">Loading POs…</div></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" tabindex="-1"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy" aria-live="polite">Saving…</div>
<p id="rc" class="sr" aria-live="polite"></p>
<?!= include('Client') ?>
<?!= include('Lang') ?>
<?!= include('Receive') ?>
<script>
let lang="en";const t=k=>(L.en[k])||k;const loadTxt=s=>s;
const CONDS=[["Good","✅","c_Good"],["Shifted load","↔️","c_Shifted"],["Collapsed pallets","⬇️","c_Collapsed"],["Double-stacked","⏫","c_Double"],["Torn / leaking bags","🩹","c_Torn"],["Wet / dirty","💧","c_Wet"],["Other","❓","c_Other"]];
const WHS=["TP","DL","BM","LY","HB"],isTPL=w=>w==="TP"||w==="DL";
const OWNERS=["Purchasing","Logistics","QC","Receiving","Inventory Control","Fulfillment"],DECISIONS=["Pending","Refuse","Accept with reservation","Repalletize and accept"];
const CATS=["Bill of lading (BOL)","Packing slip","Receiving report / tally sheet","Delivery receipt (signed)","NCR / claim","Supplier packing list","Supplier loading report","Certificate of analysis","QC report","Photos","Other"];
const ICON={up:"⚪",tom:"🔵",due:"🟡",nudge:"🟠",esc:"🔴",paused:"⏸"};
let showRem=false,DATA=null,whF="",kpiF="",ownF="",qRaw="",view="table",welcome=true,openId=null;
try{welcome=localStorage.getItem("pohub_welcome")!=="0"}catch(e){}
let HUBLINES=[];
const RCV={expOpt:r=>!!(r&&r.fromReport),title:"Tootsi receiving",nextLabel:"Back to the PO",lines:()=>HUBLINES,askP:r=>!!r.askP,fresh:r=>!!r.fresh,upload:f=>call("hubUpload",f),
 check:(r,c)=>call("hubAction",r.id,"check",c),submit:(r,pl)=>call("hubAction",r.id,"receive",pl),after:async(r)=>{await load();openPO(r.id)}};

async function load(){try{ensureReceive(i=>call("hubDiag",i));DATA=await call("hubLoad");$("uname").textContent=DATA.me+(DATA.roles?" · "+DATA.roles.join(", "):"");const tv=$("tplview");if(DATA.cfg&&DATA.cfg.portalUrl){tv.href=DATA.cfg.portalUrl+(DATA.cfg.portalUrl.indexOf("?")<0?"?":"&")+"view=3pl";tv.style.display=""}render()}catch(e){$("main").innerHTML=`<div class="err">${esc(e.message)}</div>`}}
const slaPill=r=>r.sla?`<span class="sla sla-${r.sla.lvl}" ${r.sla.h?`title="${r.sla.h} business hours"`:""}><span aria-hidden="true">${ICON[r.sla.lvl]}</span> ${esc(r.slaText)}</span>`:"";
const late=r=>r.sla&&(r.sla.lvl==="nudge"||r.sla.lvl==="esc");
const allocPill=r=>r.alloc?`<span class="pill ${r.alloc==="Production"?"a-prod":r.alloc==="Sales"?"p-done":"p-todo"}">${esc(r.alloc)}${r.alloc==="Split"?(r.prodQty!==""?` ${fmt(r.prodQty)}/${fmt(r.salesQty)}`:" (set qty)"):""}</span>`:`<span class="pill p-dmg">Not set</span>`;
const qcText=r=>r.qc==="Locked"?`QC locked${r.qcAt?" "+daysBetween(r.qcAt,DATA.today)+" d":""}`:r.qc==="Released"?"QC released":"QC: waiting";
// the cards count shipments (a container or a PO), not item lines: a 17-line container counts once
const KPIS=[
 {id:"week",l:"Shipments arriving this week",f:r=>!r.sub&&!r.closed&&r.eta>=DATA.today&&daysBetween(DATA.today,r.eta)<=6,main:1,by:"ship"},
 {id:"rcv",l:"Shipments late at warehouse",f:r=>late(r)||!!r.unplanned,alert:1,main:1,by:"ship"},
 {id:"sap",l:"Shipments arrived 2+ days, not in SAP",f:r=>r.notInSap,alert:1,main:1,by:"ship"},
 {id:"iss",l:"POs with an open issue",f:r=>r.issue&&r.issue.status==="Open",alert:1,main:1,by:"po"},
 {id:"over",l:"Issues overdue",f:r=>r.issue&&r.issue.overdue},{id:"dly",l:"Delays reported by 3PL",f:r=>!!r.delay},
 {id:"cases",l:"No expected cases yet",f:r=>!r.sub&&!r.closed&&(r.cs===""||r.cs==null)},{id:"closed",l:"Received before the hub",f:r=>!!r.closed},{id:"dest",l:"No destination",f:r=>!r.wh},
 {id:"alloc",l:"No allocation set",f:r=>!r.alloc},{id:"qc",l:"QC locked",f:r=>r.qc==="Locked"}];
function statusCell(r){let m;const s=r.sub;
 if(r.closed)m=r.removed?`<span class="pill p-grey">🗑 Removed</span>`:/master sheet/.test(r.closed)?`<span class="pill p-done">Received (master sheet)</span>`:`<span class="pill p-grey">Received before the hub</span>`;
 else if(r.req)m=`<span class="pill p-warn">Recount asked</span>`;
 else if(s){const dd=r.eta?daysBetween(r.eta,s.recv):0;m=`<span class="pill ${s.damage?"p-dmg":"p-done"}">Arrived ${fds(s.recv)}</span>${dd?`<div class="small">${Math.abs(dd)} d ${dd<0?"early":"late"} vs ETA ${fds(r.eta)}</div>`:""}`}
 else if(r.unplanned)m=`<span class="pill p-dmg">Arrived · not on list</span><div class="small">Reported ${esc(r.unplanned.at)}</div>`;
 else if(r.sla&&["due","nudge","esc","paused"].includes(r.sla.lvl))m=slaPill(r)+(r.delay?`<div class="small">${esc(r.delay.reasonText)}${r.delay.newDate?" · new date "+fds(r.delay.newDate):""}</div>`:`<div class="small">ETA ${fds(r.eta)}</div>`);
 else m=`<span class="pill p-todo">${r.eta?"ETA "+fds(r.eta):"No ETA"}</span>`;
 return m+`<div class="small">${qcText(r)}</div>${r.notInSap?`<div class="small">Not in SAP</div>`:""}`}
function baseRows(){const q=qRaw.trim().toLowerCase();return DATA.rows.filter(r=>(showRem?r.removed:!r.removed)&&(!whF||r.wh===whF)&&(!ownF||(r.issue&&r.issue.status==="Open"&&r.issue.owner===ownF))&&(!q||[r.po,r.item,r.desc,r.supplier,r.so,r.alloc,r.alloc==="Split"?"production sales":"",r.sub&&r.sub.lot,r.cntr].join(" ").toLowerCase().includes(q)))}
function weekBoard(rows){const mon=DATA.today,cols=[{k:"late",h:"Late / arrived earlier"}];for(let i=0;i<5;i++){const d=addDays(mon,i);cols.push({k:d,h:fd(d)})}cols.push({k:"next",h:"Later"});
 const colOf=r=>{const d=r.sub?r.sub.recv:(r.clockFrom||r.eta);if(!d)return"next";if(d<mon)return"late";if(d>addDays(mon,4))return"next";return d};
 return `<div class="week">${cols.map(c=>{const it=rows.filter(r=>colOf(r)===c.k);return `<div class="wcol ${c.k===DATA.today?"today":""}"><h4>${esc(c.h)}</h4>${it.length?it.map(r=>`<button type="button" class="wcard ${r.sub?"done":"lvl-"+(r.sla?r.sla.lvl:"none")}" data-open="${esc(r.id)}"><b>${esc(r.po)}</b> · ${esc(r.wh||"?")}<br>${esc(String(r.desc).slice(0,26))}<br><span class="small" style="margin:0">${r.sub?"Arrived "+fds(r.sub.recv):r.unplanned?"Not on list":esc(r.slaText||"")}</span></button>`).join(""):`<div class="small">—</div>`}</div>`}).join("")}</div>`}
const EXP=new Set(),LV=["esc","nudge","due","paused","tom","up"],rk=r=>r.sla?LV.indexOf(r.sla.lvl):99;
/** Lines of one shipment collapse to one row (the most urgent) unless the group is opened. */
function groupRows(rows){const m=new Map();rows.forEach(r=>{if(!m.has(r.ship))m.set(r.ship,[]);m.get(r.ship).push(r)});const out=[];
 m.forEach((ls,k)=>{const open=EXP.has(k)||!!qRaw.trim();const sorted=ls.slice().sort((a,b)=>rk(a)-rk(b));(open?sorted:[sorted[0]]).forEach((r,i)=>out.push({r,n:i===0?ls.length:1,open}))});return out}
function syncLine(){const s=DATA&&DATA.sync||{};if(!s.at)return "Not synced yet. Click ⇄ Sync sheets.";
 return `${s.ok?"":"⚠️ "}Last sync ${esc(s.at)}${s.ok?"":" (the Upcoming sheet could not be read)"} · SAP report ${s.sapAt?esc(s.sapLabel?s.sapLabel+" ":"")+"of "+esc(s.sapAt):"not read yet"} · Upcoming sheet last changed ${s.upcomingAt?esc(s.upcomingAt):"unknown"} · syncs every hour`}
function render(){if(showRem&&!DATA.rows.some(r=>r.removed))showRem=false;
 const base=baseRows(),kf=KPIS.find(k=>k.id===kpiF),rows=base.filter(r=>!kf||kf.f(r));
 $("main").innerHTML=`${welcome?`<div class="welcome"><div style="display:flex;justify-content:space-between;gap:10px"><h3>PO Hub pilot</h3><button type="button" class="btn ghost" id="wx" style="min-height:34px;padding:4px 10px">Hide</button></div>
  <div style="font-size:13.5px">Every PO from the upcoming sheet, with the 3PL receiving, photos, counts and issues in one place. Click a PO number to see everything. Lines of the same container are grouped: click "items" to open them. The Upcoming sheet has no cases, so the 3PL count is only compared on pallets until you add <b>expected cases</b> (open a PO, then "Expected cases for all lines"). Shipments that arrived before the hub: open them and click <b>Received before the hub</b>.</div></div>`:""}
 <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><div><h2 style="margin:0" tabindex="-1">All POs <span class="ichip">Internal only</span></h2><div class="small" id="syncline" style="margin-top:2px">${syncLine()}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><div class="view"><button type="button" data-v="table" aria-pressed="${view==="table"}" class="${view==="table"?"on":""}">Table</button><button type="button" data-v="week" aria-pressed="${view==="week"}" class="${view==="week"?"on":""}">This week</button></div>
  ${DATA.rows.some(r=>r.removed)?`<button type="button" class="btn ghost" id="remtog" aria-pressed="${showRem}">${showRem?"← Back to the plan":"🗑 Removed ("+new Set(DATA.rows.filter(r=>r.removed).map(r=>r.po)).size+")"}</button>`:""}<button type="button" class="btn ghost" id="refresh">↻ Refresh</button><button type="button" class="btn ghost" id="syncnow" title="Pull the Upcoming sheet, Arash's packing slips and the master sheet now (also runs every hour)">⇄ Sync sheets</button><button type="button" class="btn" id="addpo">＋ Add upcoming PO</button></div></div>
 <div class="kpis">${KPIS.filter(k=>k.main).map(k=>{const n=new Set(base.filter(k.f).map(r=>k.by==="po"?r.po:r.ship)).size;return `<button type="button" class="kpi ${kpiF===k.id?"on":""} ${k.alert&&n?"alert":""}" data-k="${k.id}" aria-pressed="${kpiF===k.id}"><div class="n">${n}</div><div class="l">${k.l}</div></button>`}).join("")}</div>
 <div class="bar"><label for="q" class="sr">Search</label><input id="q" type="search" placeholder="Search PO, item, product, supplier, lot, container or sales order…" value="${esc(qRaw)}">
  <div class="chips">${["",...WHS].map(w=>`<button type="button" data-w="${w}" class="${whF===w?"on":""}" aria-pressed="${whF===w}">${w||"All"}${w?`<small>${isTPL(w)?"3PL":"Tootsi"}</small>`:""}</button>`).join("")}</div>
  <select id="more" aria-label="More filters"><option value="">More filters…</option>${KPIS.filter(k=>!k.main).map(k=>`<option value="${k.id}" ${kpiF===k.id?"selected":""}>${k.l} (${base.filter(k.f).length})</option>`).join("")}</select>
  <select id="ownF" aria-label="Issue owner"><option value="">Issues: any owner</option>${OWNERS.map(o=>`<option ${ownF===o?"selected":""}>${o}</option>`).join("")}</select>
  ${kpiF||whF||ownF||qRaw?`<button type="button" class="btn ghost" id="clr">Clear filters</button>`:""}</div>
 <details class="legend"><summary>What do the colors mean?</summary><div><span class="sla sla-up">⚪ Upcoming</span><span class="sla sla-due">🟡 Expected today</span><span class="sla sla-nudge">🟠 1 business day late: nudge</span><span class="sla sla-esc">🔴 2+ business days late: escalated</span><span class="sla sla-paused">⏸ Delay reported by 3PL</span><span>Business hours Mon–Fri 8:00–17:00.</span></div></details>
 ${view==="week"?weekBoard(rows):`<div class="tw"><table><caption class="sr">Purchase orders</caption><thead><tr><th scope="col">Needs action</th><th scope="col">PO</th><th scope="col">Dest.</th><th scope="col">Item</th><th scope="col">Status</th><th scope="col">Who it's for</th><th scope="col">Qty check</th></tr></thead><tbody>
 ${rows.length?groupRows(rows).map(({r,n,open})=>`${n>1?`<tr class="grp"><td colspan="7"><button type="button" class="grpbtn" data-grp="${esc(r.ship)}" aria-expanded="${open}">${open?"▾":"▸"} ${r.cntr?"Container "+esc(r.cntr):"PO "+esc(r.po)} · <b>${n} items</b> ${open?"":"(showing the most urgent)"}</button></td></tr>`:""}<tr data-po="${esc(r.id)}" class="lvl-${r.sla?r.sla.lvl:"none"}">
  <td data-l="Needs action" class="wide ${r.needs.length?"":"nona"}">${r.needs.length?r.needs.map(a=>`<div class="need ${a.u?"u":""}">${esc(a.t)}</div>`).join(""):`<span class="small">—</span>`}</td>
  <td data-l="PO"><button type="button" class="pobtn" data-open="${esc(r.id)}">${esc(r.po)}</button>${r.source==="manual"?`<div><span class="pill a-prod" style="margin-top:4px">Manual</span></div>`:""}</td>
  <td data-l="Dest."><b>${esc(r.wh||"—")}</b><div class="small" style="margin:0">${r.wh?(isTPL(r.wh)?"3PL":"Tootsi"):"not set"}</div></td>
  <td data-l="Item" class="wide"><b>${esc(r.item)}</b> <span class="small" style="margin:0">· ${fmt(r.plt)} plt · ${fmt(r.cs)} cs · ${fmt(r.lbs)} lb</span><div class="clamp">${esc(r.desc)}${r.sub&&r.sub.lot?` · Lot ${esc(r.sub.lot)}`:""}</div></td>
  <td data-l="Status">${statusCell(r)}${r.sub&&r.sub.comment?`<div class="small" style="color:var(--blue)" title="${esc(r.sub.comment)}">💬 comment</div>`:""}</td>
  <td data-l="Who it's for">${r.unplanned?"—":allocPill(r)}${r.so?`<div class="small">${esc(r.so)}</div>`:""}</td>
  <td data-l="Qty check"><span class="pill ${r.qty.cls}">${esc(r.qty.t)}</span>${r.qty.sub?`<div class="small">${esc(r.qty.sub)}</div>`:""}</td></tr>`).join(""):`<tr><td colspan="7"><div class="empty" style="border:none">No POs match these filters.</div></td></tr>`}</tbody></table></div>`}`;
 $("rc").textContent=rows.length+" POs shown";
 document.querySelectorAll("[data-grp]").forEach(b=>b.onclick=()=>{const k=b.dataset.grp;EXP.has(k)?EXP.delete(k):EXP.add(k);render()});
 document.querySelectorAll("tr[data-po]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("[data-open]"))return;openPO(tr.dataset.po)});
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=e=>{e.stopPropagation();openPO(b.dataset.open)});
 document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{whF=b.dataset.w;render()});
 document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{kpiF=kpiF===b.dataset.k?"":b.dataset.k;render()});
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
 $("more").onchange=e=>{kpiF=e.target.value;render()};$("ownF").onchange=e=>{ownF=e.target.value;render()};
 const c=$("clr");if(c)c.onclick=()=>{kpiF=whF=ownF=qRaw="";render()};
 const qi=$("q");qi.oninput=e=>{qRaw=e.target.value;clearTimeout(qi.t);qi.t=setTimeout(()=>{render();const n=$("q");n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
 const rt0=$("remtog");if(rt0)rt0.onclick=()=>{showRem=!showRem;render()};$("addpo").onclick=openAddPO;if(!CAN("expected"))$("addpo").style.display="none";$("refresh").onclick=load;
 if(!CAN("doc"))$("syncnow").style.display="none";
$("syncnow").onclick=async()=>{busy(true);try{const r=await call("hubAction","","syncNow",{});await load();const s=r.sync||{};toast("Synced. Upcoming: "+s.upcoming+" new · SAP report: "+(typeof s.sap==="object"?s.sap.added+" new, "+s.sap.updated+" updated":s.sap)+" · slips: "+s.slips+" updated · master: "+(typeof s.master==="object"?(s.master.closed?s.master.closed+" marked received, ":"")+s.master.seen+" seen, "+s.master.preview+" to fill (preview), "+s.master.written+" written":s.master))}catch(e){toast(e.message)}busy(false)};const wx=$("wx");if(wx)wx.onclick=()=>{welcome=false;try{localStorage.setItem("pohub_welcome","0")}catch(e){}render()};
}

// ---------- roles: each department edits its own part, the rest is read-only ----------
// staff wording for the shared receiving form (the 3PL portal keeps its own)
try{Object.assign(L.en,{send:"Check and save the receipt",done_h:"Receipt saved",done_ok:"The receipt is saved in the hub.",done_p:"Saved. The difference was flagged as an issue.",com:"Comments (internal)",limit:"The numbers differ from the PO. Explain the difference below, then save."})}catch(e){}
function CAN(k){return !DATA||!DATA.can||DATA.can[k]!==false}
function lockByRole(r,tp,is){
 const off=(sel,why)=>document.querySelectorAll(sel).forEach(el=>{el.disabled=true;el.setAttribute("aria-disabled","true");if(why)el.title=why}),
  hide=sel=>document.querySelectorAll(sel).forEach(el=>el.style.display="none");
 if(!CAN("alloc"))off('[data-a],#a_prod,#a_sales,#a_so,#a_extra',"Only Purchasing can change this");
 if(!CAN("qc"))off("#a_qc","Only QC can change this");
 if(!CAN("tplInstr"))off("#a_tpl","Only Inventory Control or Purchasing can change this");
 if(!CAN("alloc")&&!CAN("qc")&&!CAN("tplInstr"))hide("#a_save");
 if(!CAN("expected")){off('#e_plt,#e_cs,#e_lbs,#e_wh,#e_eta,[data-bc]',"Only Logistics, Purchasing or Inventory Control can change this");hide("#e_save,#bc_save")}
 if(!CAN("supq")){off('[id^="pl_"],[id^="lr_"]',"Only Purchasing or Inventory Control can change this");hide("[data-saveq]")}
 if(!(tp?CAN("receive3pl"):CAN("receiveOwn")))hide("#recvown,#recvtop");
 if(!CAN("prehub"))hide("#prehub,#reopen");
 if(!CAN("expected")){hide("#q_eta_save,#removepo,#restorepo");off("#q_eta","Only Logistics, Purchasing or Inventory Control can change this")}
 if(!CAN("doc"))hide("#i_cat");
 if(r.removed)off('[data-a],#a_prod,#a_sales,#a_so,#a_extra,#a_qc,#a_tpl,#is_owner,#is_urg,#is_st,#is_dec,#is_decn,#e_plt,#e_cs,#e_lbs,#e_wh,#e_eta',"This PO was removed. Put it back in the plan to edit it."),hide("#a_save,#e_save,#bc_save,[data-saveq]");
 if(!CAN("sap"))hide("#sapbtn");
 if(!CAN("receive3pl"))hide("#askre,#nudge");
 if(!CAN("unplanned"))hide("#up_ok");
 if(!CAN("doc"))hide('label:has(#i_file)');
 if(is&&!CAN("issue")&&!(DATA.roles||[]).includes(is.owner))off("#is_owner,#is_urg,#is_st,#is_dec,#is_decn","Only Inventory Control or "+is.owner+" can change this issue");
 const db=document.querySelector("#drawer .db");if(db&&DATA.roles&&!DATA.roles.includes("Admin")){const n=document.createElement("div");n.className="small";n.style.margin="0 0 10px";
  n.textContent="Your role: "+DATA.roles.join(", ")+". You can see everything. Fields of other departments are read-only.";db.prepend(n)}}

// ---------- PO page ----------
async function act(id,action,d,msg){busy(true);try{await call("hubAction",id,action,d||{});await Promise.all([load(),id?openPO(id,true):null]);if(msg)toast(msg)}catch(e){toast(e.message);const er=$("d_err");if(er)er.textContent=e.message}busy(false)}
async function openPO(id,keepScroll){openId=id;const y=keepScroll&&$("drawer").classList.contains("open")?$("drawer").scrollTop:0;let r;
 try{r=await call("hubDetailLoad",id)}catch(e){toast(e.message);return}
 const s=r.sub,is=r.issue,tp=isTPL(r.wh),c=r.counts;
 const cell=(v,k)=>{if(v==null||v==="")return `<td style="color:var(--muted)">—</td>`;const exp=numv(r[k]),val=numv(v),skip=(k==="plt"&&r.floor)||exp==null;const bad=!skip&&(k==="lbs"?(exp&&Math.abs(val-exp)/exp>0.01):val!==exp),d=val-exp;return `<td style="${bad?"color:#b0182f;font-weight:600;background:#fdf6f7":""}">${fmt(val)}${bad?`<div style="font-size:11px">${d>0?"+":""}${fmt(d)}</div>`:""}</td>`};
 const qrow=(l,o,sub)=>`<tr><td style="font-weight:500">${esc(l)}${sub?`<div class="small" style="margin:0">${esc(sub)}</div>`:""}</td>${o?cell(o.plt,"plt")+cell(o.cs,"cs")+cell(o.lbs,"lbs"):`<td colspan="3" style="color:var(--muted)">Not entered</td>`}</tr>`;
 const sum=is&&is.status==="Open"?`⚠ ${is.type} · Owner ${is.owner} · since ${fds(is.opened)}${is.overdue?" · OVERDUE":""}`:s?`✓ Arrived ${fd(s.recv)} · ${fmt(s.cs)} cs · ${qcText(r)}`:r.removed?`🗑 Removed from the plan`:r.closed?`✓ ${/master sheet/.test(r.closed)?"Received (master sheet)":"Received before the hub"} · ${qcText(r)}`:`ETA ${fd(r.eta)} at ${r.wh||"?"}`;
 const av=r.avail;
 openD(`<div class="dh"><button type="button" class="close" id="x" aria-label="Close">×</button><div class="dsub">Purchase order · ${esc(r.wh||"no destination")} · ${esc(r.supplier)}</div><h2 class="mono" id="dtitle" tabindex="-1">PO ${esc(r.po)}</h2><div>${esc(r.item)} · ${esc(r.desc)}</div>

 const ph=$("prehub");if(ph)ph.onclick=()=>{$("phbox").innerHTML=`<div class="confirm">Mark the ${r.lines.filter(x=>!x.done).length} open line(s) of this shipment as received before the hub? The 3PL will no longer see them.<div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="btn" id="phyes">Yes, mark as received</button><button type="button" class="btn ghost" id="phno">Cancel</button></div></div>`;$("phyes").focus();$("phno").onclick=()=>{$("phbox").innerHTML=""};$("phyes").onclick=()=>act(id,"prehub",{},"Marked as received before the hub.")};
 const rop=$("reopen");if(rop)rop.onclick=()=>act(id,"reopen",{},"Reopened.");
 const bcs=$("bc_save");if(bcs)bcs.onclick=()=>{const d={};document.querySelectorAll("[data-bc]").forEach(i=>{if(i.value!=="")d[i.dataset.bc]=i.value});act(id,"expectedBulk",{cs:d},"Expected cases saved.")};
}

// ---------- add PO ----------
function openAddPO(){openD(`<div class="dh"><button type="button" class="close" id="x" aria-label="Close">×</button><h2 id="dtitle" tabindex="-1">Add a PO</h2><div class="dsub">For POs that are not in the upcoming sheet (LTL, small orders, parcels).</div></div>
 <div class="db"><form id="nf" novalidate><div class="ferr" id="d_err" role="alert"></div>
  <div class="row r3"><div><label for="n_po">PO number *</label><input class="in" id="n_po" name="po"></div><div><label for="n_item">Item code *</label><input class="in" id="n_item" name="item"></div><div><label for="n_wh">Going to *</label><select class="in" id="n_wh" name="wh"><option value="">Choose…</option>${WHS.map(w=>`<option>${w}</option>`).join("")}</select></div></div>
  <div style="margin-top:8px"><label for="n_desc">Product *</label><input class="in" id="n_desc" name="desc"></div>
  <div class="row r2" style="margin-top:8px"><div><label for="n_sup">Supplier *</label><input class="in" id="n_sup" name="supplier"></div><div><label for="n_eta">Expected arrival *</label><input class="in" type="date" id="n_eta" name="eta"></div></div>
  <div class="row r3" style="margin-top:8px"><div><label for="n_plt">Pallets *</label><input class="in" type="number" min="0" id="n_plt" name="plt"></div><div><label for="n_cs">Cases *</label><input class="in" type="number" min="0" id="n_cs" name="cs"></div><div><label for="n_lbs">Net lb *</label><input class="in" type="number" min="0" id="n_lbs" name="lbs"></div></div>
  <div class="row r2" style="margin-top:8px"><div><label for="n_load">Shipment</label><select class="in" id="n_load" name="load"><option>LTL · Palletized</option><option>FTL · Palletized</option><option>FCL 20' · Floor loaded</option><option>FCL 40' · Floor loaded</option><option>FCL 40' · Palletized</option></select></div><div><label for="n_cntr">Container #</label><input class="in" id="n_cntr" name="cntr"></div></div>
  <div class="row r2" style="margin-top:8px">${CAN("alloc")?`<div><label for="n_alloc">Allocation</label><select class="in" id="n_alloc" name="alloc"><option value="">Not set</option><option>Production</option><option>Sales</option></select></div>`:""}${CAN("alloc")?`<div><label for="n_so">Sales order</label><input class="in" id="n_so" name="so"></div>`:""}</div>
  <div style="margin-top:8px"><label for="n_instr">PO instructions (as in SAP)</label><textarea id="n_instr" name="instr" rows="2"></textarea></div>
  <button class="btn" type="submit" style="width:100%;margin-top:14px">Add PO</button></form></div>`);
 $("nf").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));busy(true);try{await call("hubAction","","addPO",f);closeD();await load();toast("PO "+f.po+" added.")}catch(er){$("d_err").textContent=er.message}busy(false)}}

load();
</script>
