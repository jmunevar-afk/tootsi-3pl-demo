<script>
// ---------- shared browser helpers (hub + portal) ----------
function $(id){return document.getElementById(id)}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const numv=v=>{if(v===""||v==null)return null;const n=+v;return isFinite(n)?n:null};
let LOCALE="en-CA";
const fmt=n=>n==null||n===""?"—":(+n).toLocaleString(LOCALE);
const fd=d=>d?new Date(String(d).slice(0,10)+"T12:00").toLocaleDateString(LOCALE,{weekday:"short",month:"short",day:"numeric"}):"—";
const fds=d=>d?new Date(String(d).slice(0,10)+"T12:00").toLocaleDateString(LOCALE,{month:"short",day:"numeric"}):"—";
const fdy=d=>d?new Date(String(d).slice(0,10)+"T12:00").toLocaleDateString(LOCALE,{year:"numeric",month:"short",day:"numeric"}):"—";
const addDays=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);const p=v=>String(v).padStart(2,"0");return x.getFullYear()+"-"+p(x.getMonth()+1)+"-"+p(x.getDate())};
const daysBetween=(a,b)=>Math.round((new Date(String(b).slice(0,10)+"T12:00")-new Date(String(a).slice(0,10)+"T12:00"))/864e5);

/** If the receiving form code did not load inline, load it from the server and report what was damaged. */
async function ensureReceive(diag){
 if(typeof openReceive==="function")return true;
 try{
  const code=await call("clientCode","Receive"),el=document.getElementById("rcvjs"),got=el?el.textContent:"(missing)";
  let i=0;while(i<code.length&&i<got.length&&code[i]===got[i])i++;
  const info="inline receive code damaged at char "+i+" of "+code.length+". sent: "+JSON.stringify(code.slice(Math.max(0,i-60),i+60))+" got: "+JSON.stringify(got.slice(Math.max(0,i-60),i+60))+" ua: "+navigator.userAgent.slice(0,80);
  console.warn(info);try{if(diag)await diag(info)}catch(e){}
  const s=document.createElement("script");s.textContent=code;document.body.appendChild(s);
  return typeof openReceive==="function";
 }catch(e){console.error(e);return false}}
/** Call a server function: await call("portalLoad", token) */
function call(fn,...args){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e&&e.message?e:new Error(String(e))))[fn](...args)})}
function busy(on){const b=$("busy");if(b)b.classList.toggle("on",!!on)}
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),3600)}

/** Read a file for upload. Photos are shrunk to max 1600 px JPEG (saves Drive space and upload time). */
function readFile(file){return new Promise((res,rej)=>{
 const fr=new FileReader();fr.onerror=()=>rej(new Error("Could not read "+file.name));
 if(!/^image\//.test(file.type)||/gif|svg/.test(file.type)){if(file.size>15e6)return rej(new Error(file.name+" is larger than 15 MB."));fr.onload=()=>res({name:file.name,type:file.type||"application/octet-stream",data:fr.result,preview:null});fr.readAsDataURL(file);return}
 fr.onload=()=>{const img=new Image();img.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);const data=c.toDataURL("image/jpeg",0.82);res({name:file.name.replace(/\.\w+$/,"")+".jpg",type:"image/jpeg",data,preview:data})};img.onerror=()=>res({name:file.name,type:file.type,data:fr.result,preview:null});img.src=fr.result};
 fr.readAsDataURL(file)})}
/** Open a file sent by the server (packing slip PDF) in a new tab; if the browser blocks it, download it instead. */
/** Show a file sent by the server (packing slip PDF). Phones block pop-ups opened after a wait, so the user taps a real link. */
function openFile(f,label){const b=Uint8Array.from(atob(f.data),ch=>ch.charCodeAt(0)),u=URL.createObjectURL(new Blob([b],{type:f.type||"application/pdf"}));
 let box=$("filebox");if(!box){box=document.createElement("div");box.id="filebox";box.setAttribute("role","dialog");box.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#16181a;color:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:92vw";document.body.appendChild(box)}
 box.innerHTML=`<span style="font-size:14px">📄 ${esc(f.name||"PDF")}</span><a href="${u}" target="_blank" rel="noopener" download="${esc(f.name||"packing-slip.pdf")}" style="background:#d71f3c;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600;white-space:nowrap">${esc(label||"Open")}</a><button type="button" aria-label="Close" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer">×</button>`;
 box.querySelector("button").onclick=()=>box.remove();box.querySelector("a").focus()}
function thumbs(arr){return arr&&arr.length?`<div class="thumbs">${arr.map(f=>f.preview?`<img src="${f.preview}" alt="${esc(f.name)}">`:`<div class="file">📄 ${esc(f.name)}</div>`).join("")}</div>`:""}

// ---------- drawer with focus handling ----------
const BG=["main","header"];
function openD(html){const d=$("drawer");if(!d.classList.contains("open"))openD.ret=document.activeElement;d.innerHTML=html;d.scrollTop=0;d.classList.add("open");$("scrim").classList.add("open");BG.forEach(s=>{const el=document.querySelector(s);if(el)el.inert=true});
 const x=$("x");if(x)x.onclick=closeD;setTimeout(()=>{const h=$("dtitle");(h||d).focus({preventScroll:true})},30)}
function closeD(){const d=$("drawer");if(!d.classList.contains("open"))return;d.classList.remove("open");$("scrim").classList.remove("open");BG.forEach(s=>{const el=document.querySelector(s);if(el)el.inert=false});
 setTimeout(()=>{if(!d.classList.contains("open"))d.innerHTML=""},260);const r=openD.ret;if(r&&document.body.contains(r))r.focus()}
document.addEventListener("keydown",e=>{const d=$("drawer");if(!d||!d.classList.contains("open"))return;
 if(e.key==="Escape"){closeD();return}
 if(e.key==="Tab"){const f=[...d.querySelectorAll('button:not([disabled]),input:not([type=file]),select,textarea,a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);if(!f.length)return;
  const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}else if(!d.contains(document.activeElement)){e.preventDefault();a.focus()}}});
document.addEventListener("DOMContentLoaded",()=>{const s=$("scrim");if(s)s.onclick=closeD});
</script>
