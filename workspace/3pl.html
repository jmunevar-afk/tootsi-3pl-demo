<!DOCTYPE html>
<html lang="fr">
<head><base target="_top"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--ink:#16181a;--muted:#62676c;--line:#e3e3df;--red:#d71f3c;--red-soft:#fde8eb;--green:#2a7550;--green-soft:#e4f3ea;--amber:#9a5c00;--amber-soft:#fff2db;--blue:#2d5d93;--blue-soft:#e6eef8;--purple:#6b3a91;--purple-soft:#f0e7f7;--shadow:0 1px 2px rgba(16,18,20,.04),0 4px 14px rgba(16,18,20,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button{font:inherit;color:inherit}
/* demo bar */
.demo-bar{background:var(--ink);color:#e9e9e6;padding:6px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.demo-bar button{font-size:12.5px;border:1px solid #555;background:transparent;color:#e9e9e6;padding:7px 14px;border-radius:20px;cursor:pointer;min-height:34px}
.demo-bar button.on{background:#fff;color:var(--ink);border-color:#fff}
/* header */
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:36px}
header .div{width:1px;height:28px;background:var(--line)}
header h1{font-size:18px;margin:0;font-weight:600}
header h1 span{color:var(--red)}
.hsub,.dsub{font-size:12.5px;color:var(--muted)}.dsub b{color:var(--ink)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:none;background:#fff;padding:7px 10px;font-size:12px;cursor:pointer;min-height:34px}
.lang button.on{background:var(--ink);color:#fff}
.signout{font-size:12px;border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);min-height:34px}
.signout:hover{border-color:var(--red);color:var(--red)}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.hello h2{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.hello p{margin:0 0 16px;color:var(--muted)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpi .l{min-height:1.3em}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;cursor:pointer;transition:border-color .12s}
.kpi:hover{border-color:var(--ink)}.kpi.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.kpi .n{font-size:24px;font-weight:600}.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.alert .n{color:var(--red)}
.chip-line{font-size:14px;color:var(--muted);margin:-6px 0 14px}
.chip-line b{color:var(--ink)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-todo{background:var(--blue-soft);color:var(--blue)}.p-done{background:var(--green-soft);color:var(--green)}.p-dmg{background:var(--red-soft);color:#b0182f}
.p-warn{background:var(--amber-soft);color:var(--amber)}.p-grey{background:#efefec;color:#55595d}.a-prod{background:var(--purple-soft);color:var(--purple)}
.small{font-size:11.5px;color:var(--muted);margin-top:4px}
/* buttons */
.btn{font-weight:500;border:none;background:var(--red);color:#fff;padding:11px 18px;border-radius:10px;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(.95)}
.btn:disabled{background:#e4e4e0;color:#55595d;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink)}
/* bar & filters */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar #q{flex:1;min-width:240px;font:inherit;padding:10px 12px;border:1px solid #8f938f;border-radius:10px;box-shadow:var(--shadow)}
.bar select{font:inherit;padding:9px 10px;border:1px solid #8f938f;border-radius:10px;background:#fff;min-height:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:12.5px;border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:20px;cursor:pointer;min-height:36px}
.chips button:hover{border-color:var(--ink)}.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button small{opacity:.65;margin-left:3px}
/* table */
.tw{overflow:auto;border-radius:12px;box-shadow:var(--shadow);background:#fff;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:#fff}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:500;padding:10px 12px;background:#fbfbfa;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f0f0ed;font-size:13px;vertical-align:top}
tr[data-po]{cursor:pointer}tr[data-po]:hover td,tr[data-po]:focus-within td{background:#fdf6f7}
.pobtn{background:none;border:none;padding:0;color:#b0182f;font-weight:600;font-family:"IBM Plex Mono",monospace;font-size:13.5px;cursor:pointer}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:12px;min-width:200px}
.need{font-size:12.5px;font-weight:500;color:var(--ink)}.need::before{content:"→ ";color:var(--muted)}.need.u{color:#b0182f}.need.u::before{content:"● ";color:#b0182f}
tr[data-po]:focus-within td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 3pl list */
.list{display:grid;gap:10px}
.group{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 0 2px;font-weight:600}
.po{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;cursor:pointer;width:100%;text-align:left;min-height:76px}
.po:hover{border-color:var(--red)}
.po .big{font-size:19px;font-weight:600}.po .m{font-size:13px;color:var(--muted);margin-top:3px}
.po .go{background:var(--red);color:#fff;border-radius:10px;padding:12px 18px;font-weight:500;white-space:nowrap}
.po.req{border-color:var(--amber);background:#fffaf0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:24px;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(16,18,20,.35);display:none;z-index:9}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:#fff;transform:translateX(100%);transition:transform .22s;overflow:auto;z-index:10;box-shadow:-10px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column}
.drawer{visibility:hidden;transition:transform .22s,visibility 0s .22s}.drawer.open{transform:none;visibility:visible;transition:transform .22s}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dh h2{margin:2px 0;font-size:22px}
.close{float:right;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:20px;color:var(--muted)}
.close:hover{border-color:var(--red);color:var(--red)}
.back{border:none;background:none;color:var(--blue);cursor:pointer;padding:0;font-size:13px;margin-bottom:6px}
.db{padding:4px 22px 30px;flex:1}
.summary{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fdf6f7;color:#7a1b2b;font-size:13px;font-weight:500}
.summary.ok{background:var(--green-soft);color:var(--green)}
.summary.info{background:#f3f4f5;color:#3d4247}
.sec{margin-top:18px}.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:600}
details.sec{border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.sec>summary{cursor:pointer;padding:13px 0;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::after{content:"＋";font-size:14px}
details.sec[open]>summary::after{content:"－"}
details.sec[open]{padding-bottom:14px}
.grid2{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px}
.grid2.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid2 .k{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.issue{border:1px solid #f3b9c2;background:#fdf6f7;border-radius:12px;padding:14px 16px;color:#7a1b2b}
.issue.closed{border-color:#bfe0cc;background:#fafdfb;color:var(--green)}
.issue.overdue{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
textarea,.in,select.in{width:100%;font:inherit;padding:10px 12px;border:1px solid #8f938f;border-radius:9px;background:#fff;color:var(--ink)}
textarea:focus,.in:focus{border-color:var(--blue)}
.row{display:grid;gap:10px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}
.note{background:#f6f6f3;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#43484c}
.msg{border-left:3px solid var(--line);padding:6px 10px;margin-bottom:8px;font-size:13px}.msg .t{font-size:11.5px;color:var(--muted)}
.confirm{margin-top:10px;padding:12px;border-radius:10px;background:#fff;border:1px solid var(--amber);color:var(--ink);font-size:13px}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{display:flex;gap:12px;padding:6px 0;font-size:13px;position:relative}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:6px;top:21px;bottom:-7px;width:2px;background:var(--line)}
.dot{width:14px;height:14px;border-radius:50%;margin-top:2px;flex:none;border:2px solid #cfcfca;background:#fff;z-index:1}
.dot.done{background:var(--green);border-color:var(--green)}.dot.now{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}.dot.bad{background:var(--red);border-color:var(--red)}
.timeline .when{color:var(--muted);margin-left:auto;font-size:12px;text-align:right}
.qt{width:100%;border-collapse:collapse;font-size:13px}
.qt th{background:none;padding:6px 8px}.qt td{padding:8px;border-bottom:1px solid #f0f0ed}
/* receiving form (big touch targets) */
.step{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;scroll-margin-top:120px}
.step.ok{border-color:#b7dcc6;background:#fafdfb}
.step.warn{border-color:#efc27a;background:#fffaf0}
.step h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;display:grid;place-items:center;flex:none}
.step.ok .num{background:var(--green)}
.step.warn .num{background:var(--amber)}
.step p{margin:0 0 12px;font-size:14px;color:#4b5055}.step label{font-size:14px;color:var(--ink);font-weight:500}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #cfcfca;border-radius:12px;min-height:64px;padding:14px;text-align:center;font-size:15px;color:var(--ink);cursor:pointer;background:#fff;font-weight:500}
.drop:hover,.drop:focus-within{border-color:var(--red);color:var(--red)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img,.thumbs .file{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs .file{display:grid;place-items:center;font-size:11px;color:var(--muted);padding:4px;text-align:center;background:#fafaf8;overflow:hidden}
.count{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.count .in,.big-in{font-size:20px;min-height:56px;padding:10px 12px}
.unit{position:relative}.unit .in{padding-right:40px}.unit i{position:absolute;right:12px;bottom:17px;font-style:normal;color:var(--muted);font-size:14px}
.tick{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;color:var(--ink);margin:10px 0 0}
.tick input{width:24px;height:24px;accent-color:var(--green);flex:none}
.cond{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cond button{min-height:56px;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;font-size:14px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cond button span{font-size:20px}
.cond button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cond button.on.badc{background:#b0182f;border-color:#b0182f}
.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 22px;z-index:2;box-shadow:0 -6px 20px rgba(0,0,0,.05)}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.prog i{width:12px;height:12px;border-radius:50%;background:#dcdcd7;display:inline-block}
.prog i.on{background:var(--green)}
.prog .miss{color:#b0182f;font-weight:600;background:#fdf0f2;border:1px solid #f3b9c2;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;min-height:44px;width:100%;text-align:left;margin-top:6px}
.foot .btn{width:100%;min-height:56px;font-size:16px}
.done-screen{text-align:center;padding:40px 10px}
.done-screen .ok{width:76px;height:76px;border-radius:50%;background:var(--green);color:#fff;font-size:40px;display:grid;place-items:center;margin:0 auto 16px}
.done-screen h2{margin:0 0 6px}

/* receiving clock colors (like the 3PL master) */
.sla{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:12px;white-space:nowrap}
.sla-up{background:#f1f1ee;color:#55595d}.sla-tom{background:#eef3fa;color:#2d5d93}.sla-due{background:#fff6cc;color:#6b4f00}.sla-nudge{background:#ffe2c2;color:#8a4200}.sla-esc{background:#fbd5da;color:#a3132b}.sla-paused{background:#efe7f7;color:#5b3a91}
tr.lvl-due td:first-child{box-shadow:inset 4px 0 0 #c99a00}tr.lvl-nudge td:first-child{box-shadow:inset 4px 0 0 #b86a00}tr.lvl-esc td:first-child{box-shadow:inset 4px 0 0 #d71f3c}tr.lvl-paused td:first-child{box-shadow:inset 4px 0 0 #7a4fb5}
tr.lvl-esc td{background:#fef6f7}
.legend{font-size:12px;color:var(--muted);margin:0 0 10px}
.legend summary{cursor:pointer;display:inline}
.legend div{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pocard{display:grid;gap:0}
.pocard.lvl-due .po{border-left:6px solid #c99a00}.pocard.lvl-nudge .po{border-left:6px solid #b86a00;background:#fffaf3}.pocard.lvl-esc .po{border-left:6px solid #d71f3c;background:#fff6f7;animation:pulsecard 1.6s ease-in-out infinite}.pocard.lvl-paused .po{border-left:6px solid #7a4fb5}
@keyframes pulsecard{50%{box-shadow:0 0 0 4px rgba(215,31,60,.18)}}
@media (prefers-reduced-motion:reduce){.pocard.lvl-esc .po{animation:none}}
.pocard .po{border-bottom-left-radius:0;border-bottom-right-radius:0}
.delaybtn{border:1px solid var(--line);border-top:none;background:#fafaf8;border-radius:0 0 14px 14px;min-height:48px;cursor:pointer;font-size:15px;color:#5b3a91;font-weight:500}
.delaybtn:hover{background:#f6f0fc}
.slarule{font-size:14px;color:#43484c;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.card.lvl-due{background:#fffcee;border-color:#c99a00}.card.lvl-nudge{background:#fff4e8;border-color:#b86a00}.card.lvl-esc{background:#fdeef0;border-color:#d71f3c}
.instr{background:#eef3fa;border:1px solid #c7d7ec;border-radius:12px;padding:12px 14px;font-size:14px;color:#1f3f66}
.banner{background:#fff4e8;border:1px solid #b86a00;color:#6a3500;border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:500}
.welcome{background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.welcome h3{margin:0 0 6px;font-size:16px}.welcome ol{margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.7}
.welcome .lnk{background:none;border:none;color:#1d4e89;text-decoration:underline;cursor:pointer;padding:0;font-size:13.5px}
.view{display:inline-flex;border:1px solid #8f938f;border-radius:10px;overflow:hidden}.view button{border:none;background:#fff;padding:9px 14px;cursor:pointer;min-height:40px}.view button.on{background:var(--ink);color:#fff}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow:auto;padding-bottom:6px}
.wcol{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
.wcol h4{margin:2px 4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.wcol.today{border-color:var(--ink)}
.wcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid #cfcfca;background:#fff;border-radius:8px;padding:7px 8px;margin-bottom:6px;cursor:pointer;font-size:12px}
.wcard b{font-family:"IBM Plex Mono",monospace;font-size:13px}.wcard:hover{border-color:var(--ink)}
.wcard.lvl-due{border-left-color:#c99a00}.wcard.lvl-nudge{border-left-color:#b86a00}.wcard.lvl-esc{border-left-color:#d71f3c;background:#fef6f7}.wcard.lvl-paused{border-left-color:#7a4fb5}.wcard.done{border-left-color:var(--green);opacity:.8}
.unpl{width:100%;min-height:52px;border:2px dashed #8f938f;background:#fff;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:12px}
.unpl:hover{border-color:var(--red);color:var(--red)}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.ichip{display:inline-flex;font-size:11px;background:var(--amber-soft);color:var(--amber);padding:3px 9px;border-radius:12px;font-weight:500}
.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}
.ferr{color:#b0182f;font-size:12px;margin-top:4px;min-height:0}
/* login */
#login{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1.1fr 1fr;background:#fff;overflow:auto}
#login.hide{display:none}
.lg-side{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-side::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:var(--red);opacity:.9}
.lg-side h2{font-size:34px;line-height:1.15;margin:0 0 14px;letter-spacing:-.6px;max-width:440px;position:relative;z-index:1}
.lg-side p{color:#c9cbcd;max-width:420px;line-height:1.5;position:relative;z-index:1}
.lg-side ul{list-style:none;padding:0;margin:22px 0 0;position:relative;z-index:1}
.lg-side li{padding:6px 0;color:#e5e6e7;font-size:14px}.lg-side li::before{content:"✓";color:#ff6b80;margin-right:10px;font-weight:600}
.lg-main{display:flex;align-items:center;justify-content:center;padding:32px}
.lg-box{width:100%;max-width:390px}
.lg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.lg-top img{height:46px}
.lg-box h1{font-size:24px;margin:0 0 6px;letter-spacing:-.3px}
.lg-box .s{color:var(--muted);margin:0 0 20px}
.lg-box label{font-size:13.5px;margin:12px 0 5px;color:var(--ink);font-weight:500}.lg-demo button:focus-visible{border-color:var(--red)}.lg-mtag{display:none;color:var(--muted);margin:-12px 0 18px;font-size:13.5px}
.lg-box .in{min-height:50px;font-size:15px}
.lg-box .btn{width:100%;margin-top:18px;min-height:52px;font-size:15px}
.lg-err{color:#b0182f;font-size:13px;margin-top:8px}.lg-err:empty{display:none}
.lg-link{background:none;border:none;color:var(--blue);cursor:pointer;padding:0;font-size:13px;margin-top:12px}
.lg-demo{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.lg-demo h4{margin:0 0 4px;font-size:13px}
.lg-demo p{font-size:12px;color:var(--muted);margin:0 0 10px}
.lg-demo div{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lg-demo button{min-height:58px;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;line-height:1.3}
.lg-demo button:hover{border-color:var(--red);color:var(--red)}
.lg-demo button small{display:block;color:var(--muted);font-size:11px}
@media(max-width:860px){
 #login{grid-template-columns:1fr}.lg-side{display:none}
 /* internal table becomes cards */
 .tw{border:none;background:none;box-shadow:none}
 .tw thead{display:none}
 .tw tr[data-po]{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
 .tw td{border:none;padding:0}
 .tw td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px}
 .tw td.wide{grid-column:1/-1}
 .clamp{min-width:0}
}
@media(max-width:860px){
 .tw tr.lvl-esc{background:#fef6f7;border-left:4px solid #d71f3c}.tw tr.lvl-nudge{border-left:4px solid #b86a00}.tw tr.lvl-due{border-left:4px solid #c99a00}.tw tr.lvl-paused{border-left:4px solid #7a4fb5}
 .tw tr[class*=lvl-] td{background:none!important;box-shadow:none!important}
 .tw td.nona{display:none}
 .kpis{grid-template-columns:1fr 1fr}
 .lg-mtag{display:block}
}
@media(max-width:640px){
 .who .avatar{display:none}.signout{min-height:44px}.lang button{min-height:44px;padding:8px 12px}
 header{padding:10px 14px;gap:10px}header .div,.hsub{display:none}header img{height:30px}
 .who .nm{display:none}
 main{padding:14px 14px 50px}
 .demo-bar{padding:6px 12px}.demo-bar .dhint{display:none}
 .r3{grid-template-columns:1fr 1fr}
 .count{grid-template-columns:1fr 1fr 1fr;gap:8px}
 .count .in{font-size:18px;padding:10px 8px}
 .unit .in{padding-right:28px}.unit i{right:8px;font-size:12px}
 .grid2{grid-template-columns:110px 1fr}
 .toast{top:12px;bottom:auto}
 .po .big{font-size:18px}
 .po{grid-template-columns:1fr}
 .po .go{text-align:center}
 .db,.dh,.foot{padding-left:16px;padding-right:16px}
}

.loading{padding:40px;text-align:center;color:var(--muted)}
.err{background:#fdeef0;border:1px solid #d71f3c;color:#7a1b2b;border-radius:10px;padding:12px 14px;margin:10px 0}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;z-index:70;place-items:center;font-weight:600}
.busy.on{display:grid}
.itrow{border-top:1px solid #ecece8;padding:10px 0}.itrow:first-of-type{border-top:none}.itrow.warn{background:#fff8ec;margin:0 -10px;padding:10px}
.itname{font-size:14px;margin-bottom:6px;line-height:1.3}.itin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
tr.grp td{background:#f7f7f4;padding:6px 12px}.grpbtn{background:none;border:none;cursor:pointer;font:inherit;font-size:13px;color:var(--ink);padding:4px 0;min-height:32px}
</style>

<script>(function(){var fr=document.createElement('iframe');fr.style.display='none';fr.title='server';document.documentElement.appendChild(fr);
var d=fr.contentDocument;d.open();d.write("<script>window.clientCode=function(n){if(n!=='Receive')throw new Error('Not available.');return \"\\n/* Receiving form for a whole SHIPMENT (one container, or one PO without a container), shared by the 3PL portal\\n   and Tootsi receiving (BM/LY/HB). The page sets:\\n   RCV = { lines(row) -> [rows of the same shipment still to receive], askP(row) -> true if pallets are counted now,\\n           upload(file) -> {fid}, check(row,count) -> {match,off,limit}, submit(row,payload), after(row,next), title, nextLabel } */\\nObject.assign(L.en,{it_h:\\\"Items in this shipment\\\",it_n:\\\"items\\\",it_cs:\\\"Cases\\\",it_lb:\\\"lb (optional)\\\",it_lbl:\\\"Label photo\\\",it_lot:\\\"Lot\\\",it_exp:\\\"Expiry\\\",it_zero:\\\"0 cases: this item did not come (no label needed).\\\",\\n sh_plt:\\\"Total pallets in the shipment\\\",s2pm:\\\"Count the pallets for the whole shipment, then the cases of each item.\\\",s2rpm:\\\"These numbers are different from the PO. Count them again:\\\",\\n limit:\\\"The count still does not match. Explain the difference below, then send.\\\",up_wait:\\\"Uploading photos\\u2026\\\",up_err:\\\"A photo did not upload. Add it again.\\\",s3m:\\\"For each item that came: a clear photo of the label, the lot and the expiry date.\\\",\\n m3m:\\\"label photo, lot and expiry for each item\\\",off_plt:\\\"Total pallets\\\",ok_line:\\\"matches\\\",cnt_first:\\\"first count\\\"});\\nObject.assign(L.fr,{it_h:\\\"Articles de cette livraison\\\",it_n:\\\"articles\\\",it_cs:\\\"Caisses\\\",it_lb:\\\"lb (facultatif)\\\",it_lbl:\\\"Photo de l'\\u00e9tiquette\\\",it_lot:\\\"Lot\\\",it_exp:\\\"Expiration\\\",it_zero:\\\"0 caisse : cet article n'est pas arriv\\u00e9 (pas d'\\u00e9tiquette).\\\",\\n sh_plt:\\\"Total des palettes de la livraison\\\",s2pm:\\\"Comptez les palettes de toute la livraison, puis les caisses de chaque article.\\\",s2rpm:\\\"Ces chiffres ne correspondent pas \\u00e0 la commande. Recomptez-les :\\\",\\n limit:\\\"Le compte ne correspond toujours pas. Expliquez l'\\u00e9cart ci-dessous, puis envoyez.\\\",up_wait:\\\"Envoi des photos\\u2026\\\",up_err:\\\"Une photo n'a pas \\u00e9t\\u00e9 envoy\\u00e9e. Ajoutez-la de nouveau.\\\",s3m:\\\"Pour chaque article re\\u00e7u : une photo claire de l'\\u00e9tiquette, le lot et la date d'expiration.\\\",\\n m3m:\\\"photo, lot et expiration de chaque article\\\",off_plt:\\\"Total des palettes\\\",ok_line:\\\"correspond\\\",cnt_first:\\\"premier compte\\\"});\\nlet form,cur,curLines;\\nconst DKEY=r=>\\\"rcv_draft_\\\"+r.ship;\\n/** The form is kept while the receiver works: closing the screen or reloading the page does not lose counts, lots or uploaded photos. */\\nfunction saveDraft(){try{if(!form||!cur)return;const strip=a=>a.filter(f=>f.fid).map(f=>({name:f.name,fid:f.fid,preview:null}));\\n const d=Object.assign({},form,{loadPics:strip(form.loadPics),doc:strip(form.doc),dmgPics:strip(form.dmgPics),li:Object.fromEntries(Object.entries(form.li).map(([k,v])=>[k,Object.assign({},v,{label:strip(v.label)})])),up:0,at:Date.now()});\\n localStorage.setItem(DKEY(cur),JSON.stringify(d))}catch(e){}}\\nfunction loadDraft(r,ids){try{const d=JSON.parse(localStorage.getItem(DKEY(r))||\\\"null\\\");if(!d||Date.now()-d.at>2*864e5)return null;\\n if(Object.keys(d.li).sort().join()!==ids.slice().sort().join())return null;return d}catch(e){return null}}\\nfunction clearDraft(r){try{localStorage.removeItem(DKEY(r))}catch(e){}}\\nfunction openReceive(r){cur=r;curLines=RCV.lines(r);const askP=RCV.askP(r),fresh=RCV.fresh?RCV.fresh(r):askP;\\n const old=loadDraft(r,curLines.map(x=>x.id));if(old){form=old;form.askP=askP;form.fresh=fresh;drawReceive();return}\\n form={recv:DATA.today,askP,fresh,plt:\\\"\\\",rplt:\\\"\\\",li:{},loadPics:[],doc:[],cond:\\\"\\\",dmgText:\\\"\\\",dmgPics:[],legible:false,stage:\\\"count\\\",checked:false,checkOk:false,off:[],needNote:false,limit:false,diffNote:\\\"\\\",comment:\\\"\\\",banner:false,up:0};\\n curLines.forEa  to the data only through these functions.\n */\nvar TABLES = {\n  POs: ['id','po','item','wh','desc','supplier','eta','clockFrom','cntr','plt','cs','lbs','load','alloc','prodQty','salesQty','so','qc','qcAt','relAt','sap','instrSap','extra','tplInstr','source','addedBy','unplannedJson','planOk','nudged','updatedAt','closed','manual'],\n  Submissions: ['subId','id','seq','superseded','by','at','recv','plt','cs','lbs','firstJson','diffNote','lot','exp','cond','damage','dmgText','comment','filesJson','ship','grpPlt'],\n  Issues: ['id','type','owner','ownerManual','status','opened','urgent','urgentManual','openManual','decision','decisionNote','updatedAt'],\n  Notes: ['id','who','text','at','ext'],\n  Delays: ['delayId','id','reason','note','newDate','by','at','date','closedAt','filesJson'],\n  Recounts: ['id','at','from','active','base'],\n  Docs: ['id','cat','name','url','by','at'],\n  SupplierQty: ['id','kind','plt','cs','lbs','by','at'],\n  Users: ['token','wh','name','email','active','user','salt','passHash','lastLogin'],\n  Sessions: ['sid','token','expires','at'],\n  Checks: ['key','at','by','off','countJson'],\n  Slips: ['po','status','url','fileId','source','action','checked'],\n  MasterSync: ['key','at','po','item','wh','field','value','status','row'],\n  MasterSeen: ['id','recv','row','checked'],\n  Config: ['key','value'],\n  Log: ['at','who','action','id','detail']\n};\n\nvar _cache = {};\n\nfunction ss_() {\n  var id = PropertiesService.getScriptProperties().getProperty('SHEET_ID');\n  return id ? SpreadsheetApp.openById(id) : SpreadsheetApp.getActiveSpreadsheet();\n}\n\nfunction sheet_(name) {\n  var sh = ss_().getSheetByName(name);\n  if (!sh) throw new Error('Missing tab \"' + name + '\". Run setup() first.');\n  return sh;\n}\n\n/** Read a whole tab as an array of objects. JSON columns are parsed. */\nfunction readAll_(name) {\n  if (_cache[name]) return _cache[name];\n  var sh = sheet_(name), cols = TABLES[name];\n  var last = sh.getLastRow();\n  var rows = last < 2 ? [] : sh.getRange(2, 1, last - 1, cols.length).getValues();\n  // number the rows BEFORE dropping blank ones, so _row always points at the real sheet row\n  var out = rows.map(function (r, i) {\n    var o = { _row: i + 2, _blank: r.join('') === '' };\n    cols.forEach(function (c, j) { o[c] = normalize_(c, r[j]); });\n    return o;\n  }).filter(function (o) { return !o._blank; });\n  out.forEach(function (o) { delete o._blank; });\n  _cache[name] = out;\n  return out;\n}\n\nfunction normalize_(col, v) {\n  if (v instanceof Date) {\n    return Utilities.formatDate(v, dbTz_(), /At$|^at$/.test(col) ? 'yyyy-MM-dd HH:mm' : 'yyyy-MM-dd');\n  }\n  if (/Json$/.test(col)) {\n    if (v === '' || v == null) return null;\n    try { return JSON.parse(v); } catch (e) { return null; }\n  }\n  if (v === true || v === false) return v;\n  if (v === 'TRUE') return true;\n  if (v === 'FALSE') return false;\n  return v === null ? '' : v;\n}\n\nvar TEXT_COLS_ = /^(field|row|status|source|action|checked|fileId|url|id|po|item|lot|token|user|salt|passHash|sid|subId|delayId|ship|eta|clockFrom|recv|exp|qcAt|relAt|sap|newDate|date|opened|nudged|from|cntr|so|key|value|closed|manual)$/;\n/**\n * Turn an object into a sheet row.\n * Every piece of text gets a leading apostrophe: Sheets then stores it exactly as typed.\n * Without it, \"=...\" would become a formula, \"-2 cs\" an error and \"12/11\" a date.\n * A number typed as text (\"21\") becomes a real number, except in text columns (PO 0042 stays 0042).\n */\nfunction toRow_(name, o) {\n  return TABLES[name].map(function (c) {\n    var v = o[c];\n    if (/Json$/.test(c)) return v == null ? '' : \"'\" + JSON.stringify(v);\n    if (v === undefined || v === null) return '';\n    if (typeof v !== 'string') return v;\n    if (v === '') return '';\n    v = v.slice(0, 5000);\n    if (!TEXT_COLS_.test(c) && /^-?\\d+(\\.\\d+)?$/.test(v)) return Number(v);\n    return \"'\" + v;\n  });\n}\n\n/** Append one object as a new row. */\nfunction append_(name, o) {\n  var sh = sheet_(name);\n  sh.appendRow(toRow_(name, o));\n  delete _cache[name];\n}\n\n/** Update the row with the same key, or append_ it. */\nfunction upsert_(name, key, o) {\n  var rows = readAll_(name);\n  var found = rows.filter(function (r) { return String(r[key]) === String(o[key]); })[0];\n  if (found) {\n    var merged = {};\n    TABLES[name].forEach(function (c) { merged[c] = (c in o) ? o[c] : found[c]; });\n    sheet_(name).getRange(found._row, 1, 1, TABLES[name].length).setValues([toRow_(name, merged)]);\n  } else {\n    append_(name, o);\n  }\n  delete _cache[name];\n}\n\n/** Update the first row where match(row) is true, or append_. */\nfunction upsertWhere_(name, match, o) {\n  var found = readAll_(name).filter(match)[0];\n  if (found) sheet_(name).getRange(found._row, 1, 1, TABLES[name].length).setValues([toRow_(name, o)]);\n  else append_(name, o);\n  delete _cache[name];\n}\n\n/** Delete every row where match(row) is true (bottom first, so row numbers stay right). */\nfunction deleteWhere_(name, match) {\n  var rows = readAll_(name).filter(match).map(function (r) { return r._row; }).sort(function (a, b) { return b - a; });\n  var sh = sheet_(name);\n  rows.forEach(function (n) { sh.deleteRow(n); });\n  delete _cache[name];\n}\n\nvar _tz = null;\n/** Time zone of the database Sheet, so dates typed in it read back as the same day. */\nfunction dbTz_() { if (!_tz) _tz = tzOr_(function () { return ss_().getSpreadsheetTimeZone(); }, 'America/Toronto'); return _tz; }\n\n/** Google sometimes returns no usable time zone for a sheet. Use the fallback then. */\nfunction tzOr_(get, fallback) {\n  try { var z = get(); if (z && typeof z === 'string' || z instanceof String) return String(z); } catch (e) {}\n  return fallback;\n}\n\nfunction clearCache_() { _cache = {}; }\n\n/** Config tab as a simple key \u2192 value map. */\nfunction config_() {\n  var m = {};\n  readAll_('Config').forEach(function (r) { m[r.key] = r.value; });\n  return m;\n}\n\n/** Save an uploaded file (base64) into Drive: <root>/<PO id>/<name>. Returns {name,url,fileId}. */\n/** Staff open photos from the hub: view access for anyone at Tootsi with the link. Never public. */\nfunction shareDomain_(file) { try { file.setSharing(DriveApp.Access.DOMAIN_WITH_LINK, DriveApp.Permission.VIEW); } catch (e) {} }\nfunction rootFolder_() { return DriveApp.getFolderById(PropertiesService.getScriptProperties().getProperty('ROOT_FOLDER_ID') || config_().ROOT_FOLDER_ID); }\n/** One folder per PO (all lines of a PO share it): \"PO Hub files/43725\". */\nfunction poFolder_(id) {\n  var root = rootFolder_(), name = String(id).split('|')[0];\n  var it = root.getFoldersByName(name);\n  return it.hasNext() ? it.next() : root.createFolder(name);\n}\n/** Server-side checks on any uploaded file: photos and PDFs only, 10 MB max. */\nfunction checkFile_(f) {\n  if (!f || !f.data) throw new Error('Empty file.');\n  var type = String(f.type || ''), data = String(f.data).split(',').pop();\n  if (!/^image\\/(jpeg|png|webp|heic|heif|gif)$/.test(type) && type !== 'application/pdf') throw new Error('Only photos and PDF files can be added.');\n  if (data.length > 14000000) throw new Error('File too large (10 MB max).');\n  // the first bytes must really be a photo or a PDF (a renamed web page or program is refused)\n  var head = Utilities.base64Decode(data.slice(0, 24)).slice(0, 12).map(function (b) { return b & 255; });\n  var hex = head.map(function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');\n  var okMagic = /^ffd8ff/.test(hex) || /^89504e47/.test(hex) || /^25504446/.test(hex) || /^47494638/.test(hex) || (/^52494646/.test(hex) && hex.slice(16, 24) === '57454250') || hex.slice(8, 16) === '66747970';\n  if (!okMagic) throw new Error('Only photos and PDF files can be added.');\n  return { name: String(f.name || 'file').replace(/[\\\\/:*?\"<>|]/g, '_').slice(0, 120), type: type, data: data };\n}\nfunction saveFile_(id, f) {\n  var bytes = Utilities.base64Decode(String(f.data).split(',').pop());\n  var file = poFolder_(id).createFile(Utilities.newBlob(bytes, f.type || 'application/octet-stream', f.name || 'file'));\n  shareDomain_(file);\n  return { name: file.getName(), url: file.getUrl(), fileId: file.getId() };\n}\n/** Uploads land first in \"PO Hub files/_incoming\", named \"<warehouse>__<name>\". The browser only gets the file id.\n *  The folder is created by setup() and its id kept, so two uploads at the same time never create two folders. */\nfunction incomingFolder_() {\n  var props = PropertiesService.getScriptProperties(), id = props.getProperty('INCOMING_ID');\n  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }\n  return withLock_(function () {\n    var root = rootFolder_(), it = root.getFoldersByName('_incoming'), f = it.hasNext() ? it.next() : root.createFolder('_incoming');\n    props.setProperty('INCOMING_ID', f.getId()); return f;\n  });\n}\nfunction saveIncoming_(who, f) {\n  var file = incomingFolder_().createFile(Utilities.newBlob(Utilities.base64Decode(f.data), f.type, who + '__' + f.name));\n  return { fid: file.getId(), name: f.name };\n}\n/** Before saving a receipt: the file must exist and must have been uploaded by this same warehouse. Nothing moves yet. */\nfunction verifyFile_(fid, who) {\n  var file;\n  try { file = DriveApp.getFileById(String(fid)); } catch (e) { throw new Error('A photo was not uploaded. Please add it again.'); }\n  var pre = who + '__', name = file.getName(), inc = incomingFolder_().getId(), ok = false, ps = file.getParents();\n  while (ps.hasNext()) if (ps.next().getId() === inc) ok = true;\n  if (!ok || file.isTrashed() || name.indexOf(pre) !== 0) throw new Error('A photo was not uploaded. Please add it again.');\n  return { name: name.slice(pre.length), url: file.getUrl() };\n}\n/** After the receipt is saved (outside the lock): move each photo into its PO folder, drop the prefix, share with Tootsi.\n *  The saved link stays valid even if a move fails; the file then simply stays in _incoming. */\nfunction finishMoves_(moves) {\n  (moves || []).forEach(function (m) {\n    try {\n      var file = DriveApp.getFileById(m.fid), pre = m.who + '__';\n      file.moveTo(poFolder_(m.poId));\n      if (file.getName().indexOf(pre) === 0) file.setName(file.getName().slice(pre.length));\n      shareDomain_(file);\n    } catch (e) { Logger.log('Could not move ' + m.fid + ': ' + e.message); }\n  });\n}\n/** Daily: uploads never used in a receipt (older than 3 days) go to the trash. */\n/** A packing slip PDF for the 3PL portal (the 3PL has no Google account, so the server sends the file itself). */\nfunction slipFile_(fileId) {\n  var blob = DriveApp.getFileById(String(fileId)).getBlob();\n  if (blob.getBytes().length > 4000000) throw new Error('Packing slip too large to open here. Ask Tootsi to email it.');\n  return { name: blob.getName() || 'packing-slip.pdf', type: blob.getContentType() || 'application/pdf', data: Utilities.base64Encode(blob.getBytes()) };\n}\nfunction cleanIncoming_() {\n  var linked = {};\n  readAll_('Submissions').forEach(function (s) { (s.filesJson || []).forEach(function (f) { if (f.fileId) linked[f.fileId] = s.id; }); });\n  var it = incomingFolder_().getFiles(), old = new Date(Date.now() - 3 * 864e5), n = 0, retry = [];\n  while (it.hasNext()) {\n    var f = it.next(), id = f.getId();\n    if (linked[id]) { retry.push({ fid: id, who: f.getName().split('__')[0], poId: linked[id] }); continue; } // part of a receipt: move it, never trash it\n    if (f.getDateCreated() < old) { f.setTrashed(true); n++; }\n  }\n  finishMoves_(retry);\n  return n;\n}\nfunction logAction_(who, action, id, detail) {\n  append_('Log', { at: nowStamp_(), who: who, action: action, id: id || '', detail: detail || '' });\n}\n\nfunction nowStamp_() { return Utilities.formatDate(new Date(), 'America/Toronto', 'yyyy-MM-dd HH:mm'); }\nfunction today_() { return Utilities.formatDate(new Date(), 'America/Toronto', 'yyyy-MM-dd'); }\n\n/**\n * Logic.gs \u2014 business rules. Pure functions: no Sheets, no Drive.\n * They take a \"state\" object (all tables) and a \"ctx\" (today, current hour, config).\n */\nvar TPL_WH = ['TP', 'DL'], OWN_WH = ['BM', 'LY', 'HB'];\nvar DELAY_OWNER = { r_notarr: 'Logistics', r_customs: 'Logistics', r_docs: 'Purchasing', r_seal: 'QC', r_wrong: 'Purchasing', r_dmg: 'QC', r_dock: 'Inventory Control', r_other: 'Inventory Control' };\nvar REASON_EN = { r_notarr: 'Truck or container not arrived', r_customs: 'Held at port or customs', r_docs: 'Missing documents (BOL, packing list)', r_seal: 'Seal broken or missing', r_wrong: 'Wrong product or labels', r_dmg: 'Damaged load, waiting for a decision', r_dock: 'Dock full or no staff', r_other: 'Other' };\nvar SLA_EN = { up: 'Upcoming', tom: 'Tomorrow', due: 'Expected today', nudge: '1 business day late', esc: '2+ business days late', paused: 'Delay reported' };\n\nfunction isTPL(w) { return TPL_WH.indexOf(w) >= 0; }\n/** A shipment = what arrives together: one container, or one PO when there is no container number. */\nfunction shipKey(p) { return (p.wh || '?') + '|' + (p.cntr ? 'C:' + p.cntr : 'P:' + p.po); }\n/** True while nothing of the shipment has been received: pallets are counted once, on that first receiving. */\n/** Nothing of the shipment was ever received (a recount does not make it fresh again). */\nfunction shipFresh(p, st) { return !shipLines(p, st).some(function (x) { return isDone(x, st) || (st.hist[x.id] || []).length > 0; }); }\n/** Pallets are counted on the first receiving of a shipment, and again when the line that holds the pallet count is recounted.\n *  ONE rule, used by the server checks AND by the 3PL / hub screens. */\nfunction shipAskP(p, st) {\n  if (shipFresh(p, st)) return true;\n  return shipLines(p, st).some(function (x) { return x.wh === p.wh && !isDone(x, st) && (st.hist[x.id] || []).some(function (s) { return s.plt !== '' && s.plt != null; }); });\n}\n/** The supplier packing s obody can ask for another 3PL's data.\n */\nfunction tplUser_(sid) {\n  var t = String(sid || '');\n  if (t.length < 20) throw new Error('SESSION');\n  var now = Date.now();\n  var s = readAll_('Sessions').filter(function (r) { return r.sid === t && Number(r.expires) > now; })[0];\n  if (!s) throw new Error('SESSION');\n  var u = readAll_('Users').filter(function (r) { return r.token === s.token && truthy(r.active); })[0];\n  if (!u) throw new Error('SESSION');\n  return u; // {wh, name, email}\n}\n\nfunction hash_(salt, pass) {\n  return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '|' + pass, Utilities.Charset.UTF_8)\n    .map(function (b) { return ('0' + (b & 255).toString(16)).slice(-2); }).join('');\n}\n\n/** Sign in. Returns a session code. 10 wrong passwords lock the username for 10 minutes. */\nfunction portalLogin(user, pass) {\n  user = String(user || '').toLowerCase().trim().slice(0, 64);\n  var key = 'fail_' + user.replace(/[^a-z0-9._-]/g, ''), cache = CacheService.getScriptCache();\n  var fails = Number(cache.get(key) || 0);\n  if (fails >= 10) throw new Error('LOCKED');\n  var u = readAll_('Users').filter(function (r) { return truthy(r.active) && r.user && String(r.user).toLowerCase() === String(user || '').toLowerCase().trim(); })[0];\n  if (!u || !u.passHash || hash_(u.salt, String(pass || '')) !== u.passHash) {\n    cache.put(key, String(fails + 1), 600);\n    throw new Error('BADLOGIN');\n  }\n  cache.remove(key);\n  var sid = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');\n  var hours = Number(config_().SESSION_HOURS || 12);\n  return withLock_(function () {\n    // drop expired sessions so the tab stays small\n    var now = Date.now();\n    deleteWhere_('Sessions', function (r) { return Number(r.expires) < now; });\n    append_('Sessions', { sid: sid, token: u.token, expires: now + hours * 3600000, at: nowStamp_() });\n    u.lastLogin = nowStamp_(); upsert_('Users', 'token', u);\n    logAction_  found\" (same message either way, so nobody can probe other warehouses). */\nfunction myPO_(st, id, u) { var p = st.pos.filter(function (x) { return String(x.id) === String(id); })[0]; if (!p || p.wh !== u.wh || p.closed || (p.unplannedJson && !truthy(p.planOk))) throw new Error('PO not found.'); return p; }\n\n/** Step 1 of any upload: one file per call, so big containers never hit Google's size limit. Returns a file id, never a link. */\nfunction portalUpload(token, f) { var u = tplUser_(token); uploadQuota_(u.wh); return saveIncoming_(u.wh, checkFile_(f)); }\n\n/** Blind check for a whole shipment. Answers which lines (and whether the pallet total) are off, never the expected numbers.\n *  At most 2 wrong checks per receiving round, recorded on the server. */\nfunction portalCheckShip(token, id, f) {\n  var u = tplUser_(token);\n  return withLock_(function () { var ctx = ctx_(), st = loadState_(); return checkShipCall_(myPO_(st, id, u), st, ctx, f || {}, u.name + ' receiving'); });\n}\nfunction portalSubmitShip(token, id, f) {\n  var u = tplUser_(token);\n  var out = withLock_(function () { var ctx = ctx_(), st = loadState_(); return submitShip_(myPO_(st, id, u), st, ctx, f || {}, u.name + ' receiving', true, u.wh); });\n  finishMoves_(out._moves); delete out._moves;\n  return out;\n}\n\nfunction portalDelay(token, id, d) {\n  var u = tplUser_(token); d = d || {};\n  var ctx0 = ctx_(); myPO_(loadState_(), id, u);\n  if (!DELAY_OWNER[d.reason] || String(d.note || '').trim().length < 5) throw new Error('Reason and details are required.');\n  var newDate = String(d.newDate || '');\n  if (newDate && (!/^\\d{4}-\\d{2}-\\d{2}$/.test(newDate) || newDate < ctx0.today || newDate > addDays(ctx0.today, 21))) throw new Error('The new date must be within the next 3 weeks.');\n  // photos are saved before taking the lock (Drive is slow)\n  var files = (d.files || []).slice(0, 10).map(function (f) { var s = saveFile_(id, checkFile_(f)); s.cat = 'Delay photo'; return s; });\n  return withLock_(function () {\n    var ctx = ctx_(), st = loadState_(), p = myPO_(st, id, u);\n    var lines = shipLines(p, st).filter(function (x) { return x.wh === u.wh && !isDone(x, st) && !st.delay[x.id]; });\n    var note = String(d.note).trim().slice(0, 1000);\n    lines.forEach(function (x, i) {\n      append_('Delays', { delayId: Utilities.getUuid(), id: x.id, reason: d.reason, note: note, newDate: newDate, by: u.name + ' receiving', at: ctx.stamp, date: ctx.today, closedAt: '', filesJson: i ? [] : files });\n      var is = st.issue[x.id]; if (is && is.status !== 'Open') { is.status = 'Open'; is.opened = ctx.today; upsert_('Issues', 'id', is); }\n    });\n    notePOs_(lines, u.name + ' receiving', 'Delay reported: ' + REASON_EN[d.reason] + '. ' + note + (newDate ? ' New date: ' + newDate : ''), ctx, true);\n    logAction_(u.name, 'delay', p.id, d.reason);\n    sync_(loadState_(), ctx);\n    return portalLoad(token);\n  });\n}\n\nfunction portalSolveDelay(token, id) {\n  var u = tplUser_(token);\n  return withLock_(function () {\n    var ctx = ctx_(), st = loadState_(), p = myPO_(st, id, u);\n    var lines = shipLines(p, st).filter(function (x) { return x.wh === u.wh && st.delay[x.id]; });\n    if (!lines.length) return portalLoad(token);\n    var reason = st.delay[lines[0].id].reason;\n    lines.forEach(function (x) {\n      var dl = st.delay[x.id], from = dl.newDate && dl.newDate > ctx.today ? dl.newDate : ctx.today;\n      dl.closedAt = ctx.stamp; upsert_('Delays', 'delayId', dl);\n      x.clockFrom = from; savePO_(x, ctx);\n    });\n    notePOs_(lines, u.name + ' receiving', 'Delay solved (' + REASON_EN[reason] + '). Receiving clock restarts ' + lines[0].clockFrom + '.', ctx, true);\n    sync_(loadState_(), ctx);\n    return portalLoad(token);\n  });\n}\n\nfunction portalUnplanned(token, d) {\n  var u = tplUser_(token); d = d || {};\n  if (!(d.files && d.files.length) || !String(d.desc || '').trim()) throw new Error('Paperwork photo and product are requi == id && r.kind === kind; }, { id: id, kind: kind, plt: v.plt, cs: v.cs, lbs: v.lbs, by: me, at: ctx.stamp });\n}\n\n// ---------- email (MailApp is included with Google Workspace) ----------\nfunction notifyIssue_(is, ctx) { notifyIssues_([is], ctx); }\n/** One email per PO and owner, listing its lines (a 17-line container sends 1 email, not 17). */\nfunction notifyIssues_(list, ctx) {\n  var cfg = ctx.cfg; if (!list.length || String(cfg.EMAIL_ON || 'no') !== 'yes') return;\n  var groups = {};\n  list.forEach(function (is) { var k = String(is.id).split('|')[0] + '#' + is.owner; (groups[k] = groups[k] || []).push(is); });\n  Object.keys(groups).forEach(function (k) {\n    var g = groups[k], is = g[0], po = k.split('#')[0];\n    var to = String(cfg['TEAM_' + String(is.owner).replace(/\\s/g, '')] || cfg.FALLBACK_EMAIL || '').trim();\n    if (String(cfg.PILOT_ONLY_ME || 'yes') === 'yes') to = cfg.FALLBACK_EMAIL;\n    if (!to) return;\n    var cc = String(cfg.PILOT_ONLY_ME || 'yes') === 'yes' ? '' : (cfg.CC_ALWAYS || '');\n    var urgent = g.some(function (x) { return truthy(x.urgent); });\n    MailApp.sendEmail({ to: to, cc: cc, subject: (urgent ? '[URGENT] ' : '') + 'PO Hub \u00b7 PO ' + po + ' \u00b7 ' + is.type + (g.length > 1 ? ' (+' + (g.length - 1) + ' more lines)' : ''),\n      body: 'Owner: ' + is.owner + '\\n\\n' + g.map(function (x) { return '\u2022 ' + String(x.id).replace('|', ' item ') + ': ' + x.type + ' (since ' + x.opened + ')'; }).join('\\n') + '\\n\\nOpen the PO Hub: ' + (cfg.HUB_URL || '') });\n  });\n}\nfunction notify3pl_(p, kind, ctx) {\n  var cfg = ctx.cfg; if (String(cfg.EMAIL_3PL || 'no') !== 'yes') return;\n  var u = readAll_('Users').filter(function (r) { return r.wh === p.wh && truthy(r.active) && r.email; })[0]; if (!u) return;\n  var fr = String(cfg['LANG_' + p.wh] || 'fr') === 'fr';\n  var subj = kind === 'recount' ? (fr ? 'Tootsi demande un recompte \u00b7 PO ' : 'Tootsi asks for a recount \u00b7 PO ') : (fr ? 'Rappel de r\u00e9ception \u00b7 PO ' : 'Receiving reminder \u00b7 PO ');\n  MailApp.sendEmail({ to: u.email, subject: subj + p.po, body: (fr ? 'Ouvrez votre portail Tootsi pour recevoir ou signaler un retard : ' : 'Open your Tootsi portal to receive or report a delay: ') + (cfg.PORTAL_URL || '') });\n}\n\n/**\n * Setup.gs \u2014 run these once from the Apps Script editor (Run \u25b6).\n *\n *  setup()            creates every tab with headers, the Drive folder, and default settings.\n *  addThreePL('TP','Trans-Plus','receiving@\u2026')  creates a private portal link for a 3PL. Run once per 3PL.\n *  loadSampleData()   optional: fills a few sample POs so you can try it right away.\n *  installTriggers()  turns on the daily jobs (import from the upcoming sheet, reminders, digest email).\n */\n/**\n * Admin functions must be run by the owner from the editor (or by a time trigger).\n * Google lets a web page call any function whose name has no trailing \"_\", so each admin function checks first.\n * A time trigger passes an event with its triggerUid. The id must belong to one of this project's triggers.\n */\nfunction requireOwner_(e) {\n  if (e && e.triggerUid) {\n    var ok = ScriptApp.getProjectTriggers().some(function (t) { return t.getUniqueId() === String(e.triggerUid); });\n    if (ok) return;\n  }\n  var a = String(Session.getActiveUser().getEmail() || '').toLowerCase(), o = String(Session.getEffectiveUser().getEmail() || '').toLowerCase();\n  if (!a || a !== o) throw new Error('Only the owner can run this from the Apps Script editor.');\n}\n\nfunction setup(e) {\n  requireOwner_(e);\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (!ss) throw new Error('Open this script from the PO Hub Google Sheet (Extensions > Apps Script).');\n  PropertiesService.getScriptProperties().setProperty('SHEET_ID', ss.getId());\n  Object.keys(TABLES).forEach(function (name) {\n    var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n    var cols = TABLES[name];\n    if (sh.getMaxColumns() < cols.length) sh.insertColumnsAfter(sh.getMaxColumns(), cols.length - sh.getMaxColumns());\n    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setBackground('#16181a').setFontColor('#ffffff');\n    sh.setFrozenRows(1);\n  });\n  var s1 = ss.getSheetByName('Sheet1'); if (s1 && ss.getSheets().length > 1) ss.deleteSheet(s1);\n\n  var props = PropertiesService.getScriptProperties();\n  var cfgFolder = config_().ROOT_FOLDER_ID;          // folder created ahead of time (Config tab)\n  if (cfgFolder && !props.getProperty('ROOT_FOLDER_ID')) props.setProperty('ROOT_FOLDER_ID', String(cfgFolder));\n  if (!props.getProperty('ROOT_FOLDER_ID')) {\n    var parent = DriveApp.getFileById(ss.getId()).getParents();\n    var folder = (parent.hasNext() ? parent.next() : DriveApp.getRootFolder()).createFolder('PO Hub files');\n    props.setProperty('ROOT_FOLDER_ID', folder.getId());\n  }\n  // the upload folder exists before anyone uploads (two first uploads at once would otherwise create two folders)\n  try { incomingFolder_(); } catch (err) { Logger.log('Could not create _incoming: ' + err.message); }\n  // Tootsi staff must be able to open photos and documents: view access for the whole domain (never \"anyone\")\n  try { rootFolder_().setSharing(DriveApp.Access.DOMAIN_WITH_LINK, DriveApp.Permission.VIEW); } catch (err) { Logger.log('Could not share the files folder with the domain: ' + err.message); }\n  var me = Session.getActiveUser().getEmail();\n  var defaults = {\n    DOMAIN: (me.split('@')[1] || 'tootsi.com'),\n    SLA_NUDGE_H: 9, SLA_ESC_H: 18, LB_TOLERANCE: 0.01, QC_DAYS: 2,\n    HOLIDAYS: '2026-12-25,2026-12-28,2027-01-01,2027-04-02,2027-05-24,2027-06-24,2027-07-01,2027-09-06,2027-10-11',\n    EMAIL_ON: 'no', PILOT_ONLY_ME: 'yes', FALLBACK_EMAIL: me, CC_ALWAYS: '', EMAIL_3PL: 'no',\n    TEAM_Purchasing: '', TEAM_Logistics: '', TEAM_QC: '', TEAM_Receiving: '', TEAM_InventoryControl: me, TEAM_Fulfillment: '',\n    LANG_TP: 'fr', LANG_DL: 'fr', SESSION_HOURS: 12, GO_LIVE: today_(), COMPARE_LB: 'no',\n    SLIP_LOG_ID: '' /* Arash's \"Packing Slip Extractor Log\" spreadsheet id */, SLIP_TAB: 'PO Status', SLIP_TO_3PL: 'after' /* after = the 3PL sees the slip once its count is sent (keeps the count blind); no; yes */,\n    MASTER_SHEET_ID: '' /* third_party_whse master id */, MASTER_TAB: '3PL', MASTER_MODE: 'preview', HUB_URL: '', PORTAL_URL: '',\n    UPCOMING_SHEET_ID: '' /* paste the ID of the UPCOMING FTL FCL sheet */, UPCOMING_TAB: 'UPCOMING FTL FCL', DIGEST_TO: me\n  };\n  var have = config_();\n  Object.keys(defaults).forEach(function (k) { if (!(k in have)) append_('Config', { key: k, value: defaults[k] }); });\n  SpreadsheetApp.getUi && toastSafe_('Setup done. Next: addThreePL, then Deploy (two web apps).');\n}\n\n/**\n * Create a 3PL login. Example: addThreePL('TP', 'Trans-Plus', 'receiving@trans-plus.com', 'transplus')\n * The temporary password shows in the execution log. Give it to the 3PL by phone, not by email.\n */\nfunction addThreePL(wh, name, email, user) {\n  requireOwner_(null);\n  wh = wh || 'TP'; name = name || (wh === 'TP' ? 'Trans-Plus' : 'Deslauriers');\n  user = String(user || (wh === 'TP' ? 'transplus' : 'deslauriers')).toLowerCase();\n  if (readAll_('Users').some(function (r) { return String(r.user).toLowerCase() === user; })) throw new Error('Username already used: ' + user);\n  var token = Utilities.getUuid().replace(/-/g, '');\n  var pass = newPassword_(), salt = Utilities.getUuid();\n  append_('Users', { token: token, wh: wh, name: name, email: email || '', active: true, user: user, salt: salt, passHash: hash_(salt, pass) });\n  Logger.log('3PL login for ' + name + ' \u2192 link: ' + (config_().PORTAL_URL || '<PORTAL_URL>') + ' \u00b7 username: ' + user + ' \u00b7 password: ' + pass);\n  return { user: user, password: pass };\n}\n\n/** New password for a 3PL login (forgotten password, or a receiver left). Old sessions are signed out. */\nfunction resetThreePLPassword(user) {\n  requireOwner_(null);\n  var u = readAll_('Users').filter(function (r) { return String(r.user).toLowerCase() === String(user).toLowerCase(); })[0];\n  if (!u) throw new Error('No such username: ' + user);\n  var pass = newPassword_(); u.salt = Utilities.getUuid(); u.passHash = hash_(u.salt, pass); upsert_('Users', 'token', u);\n  deleteWhere_('Sessions', function (r) { return r.token === u.token; });\n  Logger.log('New password for ' + u.user + ': ' + pass);\n  return pass;\n}\n\n/** Turn off a 3PL login. It also signs out any open session. */\nfunction disableThreePL(user) {\n  requireOwner_(null);\n  var u = readAll_('Users').filter(function (r) { return String(r.user).toLowerCase() === String(user).toLowerCase(); })[0];\n  if (!u) return;\n  u.active = false; upsert_('Users', 'token', u);\n  deleteWhere_('Sessions', function (r) { return r.token === u.token; });\n}\n\nfunction newPassword_() {\n  var ch = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789', p = '';\n  var bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, Utilities.getUuid() + Date.now());\n  for (var i = 0; i < 12; i++) p += ch[(bytes[i] & 255) % ch.length];\n  return p;\n}\n\nfunction installTriggers(e) {\n  requireOwner_(e);\n  ScriptApp.getProjectTriggers().forEach(function (t) { ScriptApp.deleteTrigger(t); });\n  ScriptApp.newTrigger('dailyJob').timeBased().atHour(7).nearMinute(40).everyDays(1).inTimezone('America/Toronto').create();\n  ScriptApp.newTrigger('syncSources').timeBased().everyHours(1).create();\n}\n\nfunction toastSafe_(m) { try { SpreadsheetApp.getActiveSpreadsheet().toast(m, 'PO Hub', 8); } catch (e) {} }\n\n/** Optional: a few sample POs to try the pilot. Safe to delete the rows afterwards. */\nfunction loadSampleData(e) {\n  requireOwner_(e);\n  var t = today_(), d = function (n) { return addDays(t, n); };\n  [\n    { id: '90101|10201', po: '90101', item: '10201', wh: 'TP', desc: 'RAW WHOLE CASHEWS (W-320)', supplier: 'Cashew exporter \u00b7 Vietnam', eta: d(1), c .po] = notesByPO[p.po] || { id: p.id, d: {} }); diff.forEach(function (t) { notesByPO[p.po].d[t] = true; }); changed++; }\n    });\n    // one note per PO (a 17-line container gets one note, not 17)\n    Object.keys(notesByPO).forEach(function (po) { note_(notesByPO[po].id, 'Upcoming sheet', 'Updated from the Upcoming sheet: ' + Object.keys(notesByPO[po].d).join(', '), ctx); });\n    if (added || changed) logAction_('Import', 'importUpcoming', '', added + ' new PO lines, ' + changed + ' updated');\n    return added;\n  });\n}\n\n/** Every hour (trigger) and on \"Sync now\": Upcoming sheet \u2192 hub, Arash's packing slip log \u2192 hub, hub \u2194 master sheet. */\nfunction syncSources(e) { requireOwner_(e); return syncSources_(); }\nfunction syncSources_() {\n  var out = {};\n  try { out.upcoming = importUpcoming_(); } catch (err) { out.upcoming = 'error: ' + err.message; logAction_('Sync', 'error', 'upcoming', err.message); }\n  try { out.slips = importSlips_(); } catch (err) { out.slips = 'error: ' + err.message; logAction_('Sync', 'error', 'slips', err.message); }\n  try { out.master = syncMaster_(); } catch (err) { out.master = 'error: ' + err.message; logAction_('Sync', 'error', 'master', err.message); }\n  return out;\n}\n\n/** Packing slips: Arash's extractor keeps a \"PO Status\" tab (PO, FOUND/MISSING, file link, action). Copy it into the Slips tab. */\nfunction importSlips_() {\n  var cfg = config_(); if (!cfg.SLIP_LOG_ID) return 0;\n  var sh = SpreadsheetApp.openById(cfg.SLIP_LOG_ID).getSheetByName(cfg.SLIP_TAB || 'PO Status'); if (!sh) throw new Error('Packing slip tab not found.');\n  var v = sh.getDataRange().getDisplayValues(); if (v.length < 2) return 0;\n  var h = v[0].map(function (x) { return String(x).trim().toLowerCase(); }), c = function (n) { return h.indexOf(n); };\n  var ci = { po: c('po'), st: c('packing slip'), file: c('packing slip file'), src: c('source / why it is missing'), act: c('action needed') };\n  if (ci.po < 0 || ci.st < 0) thr ('Master: header row with \"PO Number\" not found.');\n  var head = top[hr - 1].map(function (x) { return String(x).replace(/\\s+/g, ' ').trim(); }), col = function (n) { return head.indexOf(n) + 1; };\n  var C = { po: col('PO Number'), wh: col('Warehouse'), item: col('Product'), desc: col('Description'), recv: col('Receiving Date'), exp: col('Expiry Date'), units: col('Units shipped to 3PL'), docs: col('Receiving Docs'), status: col('Report Alert Status') };\n  if (!C.po || !C.wh) throw new Error('Master: PO Number / Warehouse columns not found.');\n  var last = sh.getLastRow(); if (last <= hr) return 0;\n  var n = last - hr;\n  // one read per column, everything else is compared in memory (no slow cell-by-cell reads)\n  var disp = function (c) { return c ? sh.getRange(hr + 1, c, n, 1).getDisplayValues().map(function (r) { return String(r[0]).trim(); }) : []; };\n  var raw = function (c) { return c ? sh.getRange(hr + 1, c, n, 1).getValues().map(function (r) { return r[0]; }) : []; };\n  var M = { po: disp(C.po), wh: disp(C.wh), item: disp(C.item), desc: disp(C.desc), recv: raw(C.recv), recvT: disp(C.recv), exp: disp(C.exp), expRaw: raw(C.exp), units: disp(C.units), docs: disp(C.docs), status: disp(C.status) };\n  var normPO = function (x) { return String(x).replace(/^PO\\s*#?/i, '').trim(); };\n  var rowsFor = function (po, wh) { var out = []; for (var i = 0; i < n; i++) if (normPO(M.po[i]) === po && M.wh[i].toUpperCase() === wh) out.push(i); return out; };\n  var ctx = ctx_(), seen = 0, written = 0, previewed = 0;\n  withLock_(function () {\n    var st = loadState_();\n    // READ: the master's \"Receiving Date\" often holds a PLANNED date, so trust a row only when it really looks received:\n    // units filled, a real date between Jan 2026 and today, and a status that does not say \"pending\"\n    var have = {}; readAll_('MasterSeen').forEach(function (s) { have[s.id] = s; });\n    st.pos.forEach(function (p) {\n      if (!isTPL(p.wh) || isDone(p, st)) return;\n      var hit = rowsFor(p.po, p.wh).filter(function (i) { return !C.item || M.item[i] === p.item; })[0];\n      var ds = '';\n      if (hit != null) {\n        var d = M.recv[hit], units = num(String(M.units[hit]).replace(/[^\\d.]/g, ''));\n        if (d instanceof Date && !isNaN(d) && units > 0 && !/pending/i.test(M.status[hit])) {\n          var t = Utilities.formatDate(d, 'America/Toronto', 'yyyy-MM-dd');\n          if (t >= '2026-01-01' && t <= ctx.today) ds = t;\n        }\n      }\n      if (ds && (!have[p.id] || have[p.id].recv !== ds)) { upsert_('MasterSeen', 'id', { id: p.id, recv: ds, row: String(hr + 1 + hit), checked: ctx.today }); seen++; }\n      if (!ds && have[p.id]) deleteWhere_('MasterSeen', function (r) { return r.id === p.id; });\n    });\n    // WRITE: only NEW items each hour (pending), plus the previewed ones when MASTER_MODE is switched to on\n    var todo = readAll_('MasterSync').filter(function (q) {\n      return q.status === 'pending' || (mode === 'on' && /^preview/.test(q.status)) || (q.status === 'no master row' && String(q.at) >= addDays(ctx.today, -7));\n    });\n    todo.forEach(function (q) {\n      var save = function () { upsertWhere_('MasterSync', function (r) { return r.key === q.key; }, q); };\n      var cands = rowsFor(q.po, q.wh), withItem = cands.filter(function (i) { return M.item[i] === q.item; }), blank = cands.filter(function (i) { return M.item[i] === ''; });\n      var row = withItem.length === 1 ? withItem[0] : (!withItem.length && blank.length === 1 ? blank[0] : null);\n      if (row == null) { q.status = withItem.length > 1 || blank.length > 1 ? 'several master rows: fill by hand' : 'no master row'; save(); return; }\n      var c = C[q.field]; if (!c) { q.status = 'column not in master'; save(); return; }\n      var cur = String((q.field === 'recv' ? M.recvT : M[q.field] || [])[row] || '').trim();\n      q.row = String(hr + 1 + row);\n      if (cur !== '') {\n        // dates are compared as dates (the master shows 2  let box=$("filebox");if(!box){box=document.createElement("div");box.id="filebox";box.setAttribute("role","dialog");box.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#16181a;color:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:92vw";document.body.appendChild(box)}
 box.innerHTML=`<span style="font-size:14px">📄 ${esc(f.name||"PDF")}</span><a href="${u}" target="_blank" rel="noopener" download="${esc(f.name||"packing-slip.pdf")}" style="background:#d71f3c;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600;white-space:nowrap">${esc(label||"Open")}</a><button type="button" aria-label="Close" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer">×</button>`;
 box.querySelector("button").onclick=()=>box.remove();box.querySelector("a").focus()}
function thumbs(arr){return arr&&arr.length?`<div class="thumbs">${arr.map(f=>f.preview?`<img src="${f.preview}" alt="${esc(f.name)}">`:`<div class="file">📄 ${esc(f.name)}</div>`).join("")}</div>`:""}

// ---------- drawer with focus handling ----------
const BG=["main","header"];
function openD(html){const d=$("drawer");if(!d.classList.contains("open"))openD.ret=document.activeElement;d.innerHTML=html;d.scrollTop=0;d.classList.add("open");$("scrim").classList.add("open");BG.forEach(s=>{const el=document.querySelector(s);if(el)el.inert=true});
 const x=$("x");if(x)x.onclick=closeD;setTimeout(()=>{const h=$("dtitle");(h||d).focus({preventScroll:true})},30)}
function closeD(){const d=$("drawer");if(!d.classList.contains("open"))return;d.classList.remove("open");$("scrim").classList.remove("open");BG.forEach(s=>{const el=document.querySelector(s);if(el)el.inert=false});
 setTimeout(()=>{if(!d.classList.contains("open"))d.innerHTML=""},260);const r=openD.ret;if(r&&document.body.contains(r))r.focus()}
document.addEventListener("keydown",e=>{const d=$("drawer");if(!d||!d.classList.contains("open"))return;
 if(e.key==="Escape"){closeD();return}
 if(e.key==="Tab"){const f=[...d.querySelectorAll('button:not([disabled]),input:not([type=file]),select,textarea,a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);if(!f.length)return;
  const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}else if(!d.contains(document.activeElement)){e.preventDefault();a.focus()}}});
document.addEventListener("DOMContentLoaded",()=>{const s=$("scrim");if(s)s.onclick=closeD});
</script>

<script id="rcvjs">
/* Receiving form for a whole SHIPMENT (one container, or one PO without a container), shared by the 3PL portal
   and Tootsi receiving (BM/LY/HB). The page sets:
   RCV = { lines(row) -> [rows of the same shipment still to receive], askP(row) -> true if pallets are counted now,
           upload(file) -> {fid}, check(row,count) -> {match,off,limit}, submit(row,payload), after(row,next), title, nextLabel } */
Object.assign(L.en,{it_h:"Items in this shipment",it_n:"items",it_cs:"Cases",it_lb:"lb (optional)",it_lbl:"Label photo",it_lot:"Lot",it_exp:"Expiry",it_zero:"0 cases: this item did not come (no label needed).",
 sh_plt:"Total pallets in the shipment",s2pm:"Count the pallets for the whole shipment, then the cases of each item.",s2rpm:"These numbers are different from the PO. Count them again:",
 limit:"The count still does not match. Explain the difference below, then send.",up_wait:"Uploading photos…",up_err:"A photo did not upload. Add it again.",s3m:"For each item that came: a clear photo of the label, the lot and the expiry date.",
 m3m:"label photo, lot and expiry for each item",off_plt:"Total pallets",ok_line:"matches",cnt_first:"first count"});
Object.assign(L.fr,{it_h:"Articles de cette livraison",it_n:"articles",it_cs:"Caisses",it_lb:"lb (facultatif)",it_lbl:"Photo de l'étiquette",it_lot:"Lot",it_exp:"Expiration",it_zero:"0 caisse : cet article n'est pas arrivé (pas d'étiquette).",
 sh_plt:"Total des palettes de la livraison",s2pm:"Comptez les palettes de toute la livraison, puis les caisses de chaque article.",s2rpm:"Ces chiffres ne correspondent pas à la commande. Recomptez-les :",
 limit:"Le compte ne correspond toujours pas. Expliquez l'écart ci-dessous, puis envoyez.",up_wait:"Envoi des photos…",up_err:"Une photo n'a pas été envoyée. Ajoutez-la de nouveau.",s3m:"Pour chaque article reçu : une photo claire de l'étiquette, le lot et la date d'expiration.",
 m3m:"photo, lot et expiration de chaque article",off_plt:"Total des palettes",ok_line:"correspond",cnt_first:"premier compte"});
let form,cur,curLines;
const DKEY=r=>"rcv_draft_"+r.ship;
/** The form is kept while the receiver works: closing the screen or reloading the page does not lose counts, lots or uploaded photos. */
function saveDraft(){try{if(!form||!cur)return;const strip=a=>a.filter(f=>f.fid).map(f=>({name:f.name,fid:f.fid,preview:null}));
 const d=Object.assign({},form,{loadPics:strip(form.loadPics),doc:strip(form.doc),dmgPics:strip(form.dmgPics),li:Object.fromEntries(Object.entries(form.li).map(([k,v])=>[k,Object.assign({},v,{label:strip(v.label)})])),up:0,at:Date.now()});
 localStorage.setItem(DKEY(cur),JSON.stringify(d))}catch(e){}}
function loadDraft(r,ids){try{const d=JSON.parse(localStorage.getItem(DKEY(r))||"null");if(!d||Date.now()-d.at>2*864e5)return null;
 if(Object.keys(d.li).sort().join()!==ids.slice().sort().join())return null;return d}catch(e){return null}}
function clearDraft(r){try{localStorage.removeItem(DKEY(r))}catch(e){}}
function openReceive(r){cur=r;curLines=RCV.lines(r);const askP=RCV.askP(r),fresh=RCV.fresh?RCV.fresh(r):askP;
 const old=loadDraft(r,curLines.map(x=>x.id));if(old){form=old;form.askP=askP;form.fresh=fresh;drawReceive();return}
 form={recv:DATA.today,askP,fresh,plt:"",rplt:"",li:{},loadPics:[],doc:[],cond:"",dmgText:"",dmgPics:[],legible:false,stage:"count",checked:false,checkOk:false,off:[],needNote:false,limit:false,diffNote:"",comment:"",banner:false,up:0};
 curLines.forEach(x=>form.li[x.id]={cs:"",lbs:"",rcs:"",rlbs:"",lot:"",exp:"",label:[]});drawReceive()}
const isOff=k=>form.stage==="recount"&&form.off.indexOf(k)>=0;
/** The count that is checked and sent: recount values replace the first count for the lines that were off. */
function curCount(){return{plt:form.askP?numv(isOff("pallets")?form.rplt:form.plt):null,lines:curLines.map(x=>{const v=form.li[x.id],o=isOff(x.id);return{id:x.id,cs:numv(o?v.rcs:v.cs),lbs:numv(o?v.rlbs:v.lbs)}})}}
const came=id=>{const c=curCount().lines.find(z=>z.id===id);return c&&c.cs>0};
function steps(){const bad=form.cond&&form.cond!=="Good",c=curCount();
 const nums=(!form.askP||(c.plt!=null&&c.plt>=0))&&c.lines.every(z=>z.cs!=null&&z.cs>=0&&(z.lbs==null||z.lbs>=0)),dateOk=!!form.recv&&form.recv<=DATA.today;
 const labelsOk=curLines.every(x=>{if(!came(x.id))return true;const v=form.li[x.id];return v.label.length>0&&v.lot.trim()&&v.exp&&v.exp>form.recv});
 const expErr=curLines.some(x=>{const v=form.li[x.id];return came(x.id)&&v.exp&&v.exp<=form.recv});
 return[{k:"s1",ok:!form.fresh||form.loadPics.length>0,m:"m1"},
  {k:"s2",ok:nums&&dateOk&&form.checked&&(!form.needNote||form.diffNote.trim().length>=10),m:!nums||!dateOk?(form.stage==="recount"?"m2r":"m2"):!form.checked?"m2c":"m2n",err:!dateOk&&form.recv?"e_date":""},
  {k:"s3",ok:labelsOk&&form.legible,m:"m3m",err:expErr?"e_exp":""},
  {k:"s4",ok:form.doc.length>0,m:"m4"},
  {k:"s5",ok:!!form.cond&&(!bad||(form.dmgText.trim().length>=10&&form.dmgPics.length>0)),m:bad?"m5n":"m5"}]}
function foot(){const f=$("foot");if(!f)return;const s=steps(),n=s.filter(x=>x.ok).length,miss=s.find(x=>!x.ok),onlyCheck=miss&&miss.m==="m2c"&&s.filter(x=>!x.ok).length===1;
 f.innerHTML=`<div class="prog">${s.map(x=>`<i class="${x.ok?"on":""}" aria-hidden="true"></i>`).join("")}<span>${form.up?t("up_wait"):t("steps")+t("colon")+" "+n+"/5"}</span>${miss&&!form.up?`<button type="button" class="miss" data-goto="${miss.k}">${t("missing")}${t("colon")} ${t(miss.m)}</button>`:""}</div>
 <button type="button" class="btn" id="send" ${(miss&&!onlyCheck)||form.up?"disabled":""}>${t("send")}</button>`;
 s.forEach(x=>{const el=$("st_"+x.k);if(el)el.classList.toggle("ok",!!x.ok);const er=$("err_"+x.k);if(er)er.textContent=x.err?t(x.err):""});
 const g=f.querySelector("[data-goto]");if(g)g.onclick=()=>{$("st_"+g.dataset.goto).scrollIntoView({behavior:"smooth",block:"start"})};
 $("send").onmousedown=e=>e.preventDefault();$("send").onclick=submit}
/** Upload each photo as soon as it is chosen (one server call per file). */
async function addFiles(list,arr){for(const file of list){let rf;try{rf=await readFile(file)}catch(e){toast(e.message);continue}
 const item={name:rf.name,preview:rf.preview,fid:null};arr.push(item);form.up++;drawReceive();
 try{const r=await RCV.upload({name:rf.name,type:rf.type,data:rf.data});item.fid=r.fid}catch(e){arr.splice(arr.indexOf(item),1);toast(t("up_err")+" "+(typeof errT==="function"?errT(e.message):e.message))}
 form.up--;drawReceive()}}
function drawReceive(){
 const r=cur,recount=form.stage==="recount",bad=form.cond&&form.cond!=="Good",n=i=>`<span class="num" aria-hidden="true">${i}</span>`,many=curLines.length>1;
 const inp=(id,val,mode,ph)=>`<input class="in" id="${id}" type="number" inputmode="${mode||"numeric"}" min="0" step="any" value="${esc(val)}" ${ph?`placeholder="${esc(ph)}"`:""}>`;

/** Ask the server if the count matches. It answers which lines are off, never the expected numbers. 2 wrong checks max. */
async function runCheck(fromSend){
 const c=curCount();if((form.askP&&(c.plt==null||c.plt<0))||c.lines.some(z=>z.cs==null||z.cs<0)){foot();$("st_s2").scrollIntoView({behavior:"smooth",block:"start"});return false}
 busy(true);let res;try{res=await RCV.check(cur,c)}catch(e){busy(false);toast(typeof errT==="function"?errT(e.message):e.message);return false}busy(false);
 if(res.match){form.checked=form.checkOk=true;form.banner=false;drawReceive();return true}
 if(form.stage==="count"&&!res.limit){form.off=res.off||[];form.stage="recount";form.rplt="";curLines.forEach(x=>{form.li[x.id].rcs=form.li[x.id].rlbs=""});form.checked=form.checkOk=false;form.banner=fromSend;drawReceive();
  setTimeout(()=>{fromSend?$("drawer").scrollTop=0:$("st_s2").scrollIntoView({behavior:"smooth",block:"start"});const f=$("f_rplt")||document.querySelector("#st_s2 input[type=number]");if(f)f.focus({preventScroll:true})},60);if(fromSend)toast(t("notsent"));return false}
 if(form.stage==="count"&&res.limit){form.off=res.off||[]}
 form.checked=true;form.checkOk=false;form.needNote=true;form.limit=!!res.limit;form.banner=false;drawReceive();setTimeout(()=>$("f_note")&&$("f_note").focus(),60);return false}
async function submit(){
 if(form.up)return;
 if(!form.checked){const ok=await runCheck(true);if(!ok)return}
 const s=steps();if(s.some(x=>!x.ok)){foot();$("st_"+s.find(x=>!x.ok).k).scrollIntoView({behavior:"smooth",block:"start"});return}
 const c=curCount(),ids=a=>a.filter(f=>f.fid).map(f=>f.fid);
 const payload={recv:form.recv,plt:c.plt,diffNote:form.diffNote,cond:form.cond,dmgText:form.dmgText,comment:form.comment,load:ids(form.loadPics),doc:ids(form.doc),dmg:ids(form.dmgPics),
  lines:c.lines.map(z=>{const v=form.li[z.id];return{id:z.id,cs:z.cs,lbs:z.lbs,lot:came(z.id)?v.lot:"",exp:came(z.id)?v.exp:"",label:came(z.id)?ids(v.label):[]}})};
 busy(true);let res;try{res=await RCV.submit(cur,payload)}catch(e){busy(false);
  // a lost answer: the receipt may already be saved. Reload and check before showing an error.
  if(/Already received/.test(e.message)){clearDraft(cur);toast(t("done_h"));closeD();RCV.after(cur,false);return}
  toast(e.message==="RECOUNT"?t("notsent"):(typeof errT==="function"?errT(e.message):e.message));return}busy(false);clearDraft(cur);
 const tot=c.lines.reduce((a,z)=>a+(z.cs||0),0);
 openD(`<div class="dh"><button type="button" class="close" id="x" aria-label="${esc(t("close"))}">×</button><h2 id="dtitle" tabindex="-1" class="mono">${cur.cntr?esc(cur.cntr):"PO "+esc(cur.po)}</h2></div>
 <div class="db"><div class="done-screen"><div class="ok" aria-hidden="true">✓</div><h2>${t("done_h")}</h2><p class="mono" style="font-size:16px">${c.plt!=null?fmt(c.plt)+" "+t("u_plt")+" · ":""}${fmt(tot)} ${t("u_cs")}${curLines.length>1?" · "+curLines.length+" "+t("it_n"):""}</p>
  <p style="color:${res.flagged?"#b0182f":"var(--muted)"}">${res.flagged?t("done_p"):t("done_ok")}</p><button type="button" class="btn" id="nextd" style="min-width:220px;min-height:52px">${RCV.nextLabel||t("next")}</button></div></div>`);
 $("x").onclick=()=>{closeD();RCV.after(cur,false)};$("nextd").onclick=()=>{closeD();RCV.after(cur,true)};
