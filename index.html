<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tootsi 3PL Portal — Demo</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--ink:#16181a;--muted:#6b7075;--line:#e7e7e3;--red:#d71f3c;--red-soft:#fde8eb;--green:#2e7d55;--green-soft:#e4f3ea;--amber:#b26b00;--amber-soft:#fff2db;--blue:#2d5d93;--blue-soft:#e6eef8;--shadow:0 1px 2px rgba(16,18,20,.04),0 4px 14px rgba(16,18,20,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace}
.demo-bar{background:var(--ink);color:#e9e9e6;padding:8px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.demo-bar b{color:#fff}
.demo-bar button{font:inherit;font-size:12.5px;border:1px solid #444;background:transparent;color:#e9e9e6;padding:5px 12px;border-radius:20px;cursor:pointer}
.demo-bar button.on{background:#fff;color:var(--ink);border-color:#fff}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:36px}
header .div{width:1px;height:28px;background:var(--line)}
header h1{font-size:18px;margin:0;font-weight:600}
header h1 span{color:var(--red)}
header .sub{font-size:12px;color:var(--muted)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:22px 24px 50px}
.hello h2{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.hello p{margin:0 0 18px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .n{font-size:26px;font-weight:600}.kpi .l{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:20px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:grid;gap:10px}
.po{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;cursor:pointer;transition:border-color .12s}
.po:hover{border-color:var(--red)}
.po .date{font-size:12px;color:var(--muted)}.po .date b{display:block;font-size:17px;color:var(--ink)}
.po .t{font-weight:500}.po .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-todo{background:var(--blue-soft);color:var(--blue)}.p-done{background:var(--green-soft);color:var(--green)}.p-dmg{background:var(--red-soft);color:var(--red)}
.btn{font:inherit;font-weight:500;border:none;background:var(--red);color:#fff;padding:11px 18px;border-radius:10px;cursor:pointer}
.btn:disabled{background:#d9d9d5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(16,18,20,.35);display:none;z-index:9}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:#fff;transform:translateX(100%);transition:transform .22s;overflow:auto;z-index:10;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.dh{padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.dh h2{margin:2px 0;font-size:22px}
.close{float:right;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;color:var(--muted)}
.db{padding:4px 24px 30px}
.sec{margin-top:20px}.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13px;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid2 .k{color:var(--muted)}
.step{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.step.ok{border-color:#bfe0cc;background:#fafdfb}
.step h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.num{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
.step.ok .num{background:var(--green)}
.step p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.drop{display:block;border:2px dashed #d6d6d0;border-radius:10px;padding:16px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--red);color:var(--red)}
.drop input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img,.thumbs .file{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs .file{display:grid;place-items:center;font-size:11px;color:var(--muted);padding:4px;text-align:center;background:#fafaf8}
.yn{display:flex;gap:8px}
.yn button{flex:1;font:inherit;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
.yn button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea,.in{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;outline:none}
textarea:focus,.in:focus{border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row2 label{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-top:8px}
.note{background:#fafaf8;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#4b5055}
.lock{background:var(--amber-soft);color:#6d4a10;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:500;padding:10px 14px;background:#fbfbfa;border-bottom:1px solid var(--line)}
tr[data-po]:hover td{background:#fdf6f7}
td{padding:11px 14px;border-bottom:1px solid #f0f0ed;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
@media(max-width:640px){.po{grid-template-columns:1fr}.row2{grid-template-columns:1fr}header .div,header .sub{display:none}}
</style>
</head>

function openReceive(po){
 const p=view3pl(POS.find(x=>x.po===po)),s=SUB[po];
 form=s?{...s}:{recv:"2026-11-23",plt:p.plt,cs:"",label:[],doc:[],damage:null,dmgText:"",dmgPics:[],legible:false};
 drawReceive(p,!!s);
 $("drawer").classList.add("open");$("scrim").classList.add("open");
}
function thumbs(arr){return `<div class="thumbs">${arr.map(f=>f.type?.startsWith("image")?`<img src="${f.url}" alt="">`:`<div class="file">📄 ${esc(f.name)}</div>`).join("")}</div>`}
function drawReceive(p,ro){
 const okLabel=form.label.length&&form.legible, okDoc=form.doc.length, okDmg=form.damage===false||(form.damage===true&&form.dmgText.trim().length>=10&&form.dmgPics.length);
 const okQty=form.recv&&form.plt!==""&&form.cs!=="";
 const ready=okLabel&&okDoc&&okDmg&&okQty;
 $("drawer").innerHTML=`
 <div class="dh"><button class="close" id="x">×</button><div class="sub" style="color:var(--muted);font-size:12px">Receiving for Tootsi</div><h2 class="mono">PO ${p.po}</h2><div>${p.item} · ${esc(p.desc)}</div></div>
 <div class="db">
  <div class="sec"><h3>Delivery details</h3><div class="grid2">
   <span class="k">Expected</span><span>${fd(p.eta)}</span>
   <span class="k">Pallets expected</span><span>${p.plt}</span>
   <span class="k">Shipment</span><span>${esc(p.load)}</span>
   <span class="k">Container</span><span class="mono">${p.cntr||"—"}</span>
  </div></div>
  ${ro?`<div class="sec"><div class="note">Sent to Tootsi on ${esc(SUB[p.po].at||"")}. Contact Tootsi Inventory Control to make a change.</div></div>`:""}
  <div class="sec"><h3>Your receiving</h3>
   <div class="step ${okQty?"ok":""}"><h4><span class="num">1</span>What you received</h4>
    <div class="row2"><div><label>Date received</label><input class="in" type="date" id="f_recv" value="${form.recv}" ${ro?"disabled":""}></div>
    <div><label>Pallets</label><input class="in" type="number" id="f_plt" value="${form.plt}" ${ro?"disabled":""}></div>
    <div><label>Cases</label><input class="in" type="number" id="f_cs" value="${form.cs}" ${ro?"disabled":""}></div></div>
    ${form.plt!==""&&+form.plt!==p.plt?`<p style="color:var(--amber);margin:8px 0 0">Different from the ${p.plt} pallets expected. Please explain below.</p>`:""}
   </div>
   <div class="step ${okLabel?"ok":""}"><h4><span class="num">2</span>Label photo</h4>
    <p>Take a clear, close photo of the product label. Item code, lot number and expiry must be readable.</p>
    ${ro?"":`<label class="drop"><input type="file" accept="image/*" capture="environment" multiple data-f="label">📷 Take or choose photo</label>`}
    ${thumbs(form.label)}
    ${ro?"":`<label class="check"><input type="checkbox" id="f_leg" ${form.legible?"checked":""}> I checked: the lot number and expiry are easy to read in the photo.</label>`}
   </div>
   <div class="step ${okDoc?"ok":""}"><h4><span class="num">3</span>Receiving document</h4>
    <p>Your signed receiving report or BOL, as a PDF or photo.</p>
    ${ro?"":`<label class="drop"><input type="file" accept="image/*,application/pdf" multiple data-f="doc">📄 Add receiving document</label>`}
    ${thumbs(form.doc)}
   </div>
   <div class="step ${okDmg?"ok":""}"><h4><span class="num">4</span>Any damage or shortage?</h4>
    <div class="yn"><button data-y="0" class="${form.damage===false?"on":""}" ${ro?"disabled":""}>No, all good</button><button data-y="1" class="${form.damage===true?"on":""}" ${ro?"disabled":""}>Yes</button></div>
    ${form.damage?`<div style="margin-top:10px"><textarea id="f_dmg" rows="3" placeholder="Short explanation: what, how many, where (e.g. 3 bags torn on pallet 4, product spilled)" ${ro?"disabled":""}>${esc(form.dmgText)}</textarea>
     ${ro?"":`<label class="drop" style="margin-top:8px"><input type="file" accept="image/*" capture="environment" multiple data-f="dmgPics">📷 Add damage photos</label>`}
     ${thumbs(form.dmgPics)}</div>`:""}
   </div>
   ${ro?"":`<button class="btn" id="send" style="width:100%;margin-top:6px" ${ready?"":"disabled"}>${ready?"Send to Tootsi":"Complete all 4 steps to send"}</button>`}
  </div>
 </div>`;
 $("x").onclick=closeD;
 if(ro)return;
 const rd=()=>drawReceive(p,false);
 $("f_recv").onchange=e=>{form.recv=e.target.value;rd()};
 $("f_plt").onchange=e=>{form.plt=e.target.value;rd()};
 $("f_cs").onchange=e=>{form.cs=e.target.value;rd()};
 const leg=$("f_leg");if(leg)leg.onchange=e=>{form.legible=e.target.checked;rd()};
 document.querySelectorAll("[data-f]").forEach(i=>i.onchange=()=>{[...i.files].forEach(f=>form[i.dataset.f].push({name:f.name,type:f.type,url:URL.createObjectURL(f)}));rd()});
 document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{form.damage=b.dataset.y==="1";rd()});
 const t=$("f_dmg");if(t)t.oninput=e=>{form.dmgText=e.target.value;const btn=$("send");const ok=form.dmgText.trim().length>=10&&form.dmgPics.length&&okLabel&&okDoc&&okQty;btn.disabled=!ok;btn.textContent=ok?"Send to Tootsi":"Complete all 4 steps to send"};
 const s=$("send");if(s)s.onclick=()=>{
  SUB[p.po]={...form,by:ROLES[role].name+" ("+role+")",at:new Date().toLocaleString("en-CA",{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})};
  closeD();tab="done";render();toast(form.damage?"Sent. Tootsi Purchasing was alerted about the damage.":"Sent to Tootsi. Thank you!");
 };
}
function closeD(){$("drawer").classList.remove("open");$("scrim").classList.remove("open")}
$("scrim").onclick=closeD;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeD()});

function renderTootsi(){
 const rows=POS.map(p=>({p,s:SUB[p.po]}));
 const dmg=rows.filter(r=>r.s?.damage).length;
 $("main").innerHTML=`
 <div class="lock">This view is internal. It shows Tootsi-only fields (stock, allocation). DL and TP never receive these: their screens only get PO, item, date, container, pallets and shipment type.</div>
 <div class="kpis">
  <div class="kpi"><div class="n">${rows.filter(r=>r.s).length}</div><div class="l">Received and documented by 3PL</div></div>
  <div class="kpi"><div class="n">${rows.filter(r=>!r.s).length}</div><div class="l">Waiting for 3PL upload</div></div>
  <div class="kpi" style="${dmg?"border-color:var(--red)":""}"><div class="n" style="${dmg?"color:var(--red)":""}">${dmg}</div><div class="l">Damage or shortage reported</div></div>
 </div>
 <table><thead><tr><th>PO</th><th>3PL</th><th>Item</th><th>Expected</th><th>Status</th><th>Uploads</th><th>Internal only</th></tr></thead><tbody>
 ${rows.map(({p,s})=>`<tr style="cursor:pointer" data-po="${p.po}">
  <td class="mono"><b style="color:var(--red)">${p.po}</b></td><td><b>${p.wh}</b></td><td>${p.item}<div style="color:var(--muted);font-size:12px">${esc(p.desc)}</div></td>
  <td>${fd(p.eta)}</td>
  <td>${s?(s.damage?'<span class="pill p-dmg">Damage reported</span>':'<span class="pill p-done">Received</span>'):'<span class="pill p-todo">Waiting</span>'}${s?`<div style="color:var(--muted);font-size:11.5px;margin-top:4px">${esc(s.by)} · ${esc(s.at)}</div>`:""}</td>
  <td style="font-size:12px">${(INT[p.po]||[]).length?`<div>📎 ${(INT[p.po]||[]).length} Tootsi doc(s)</div>`:""}${s?`Label ${s.label.length||(s.demo?"✓":0)} · Doc ${s.doc.length||(s.demo?"✓":0)}${s.damage?" · Photos "+(s.dmgPics.length||(s.demo?"✓":0)):""}`:"—"}</td>
  <td style="font-size:12px;color:var(--muted)">${p._private.alloc?"Alloc: "+p._private.alloc:""}${p._private.stock?"<br>Stock: "+p._private.stock.toLocaleString():""}</td></tr>
  ${s?.damage?`<tr><td></td><td colspan="6" style="background:#fdf6f7;font-size:12.5px"><b style="color:var(--red)">Damage note:</b> ${esc(s.dmgText)} <span style="color:var(--muted)">· Received ${s.plt} plt / ${s.cs} cs</span></td></tr>`:""}`).join("")}
 </tbody></table>
 <p class="note" style="margin-top:14px">Click any PO to see everything about it and add documents. Tip: switch to "TP user" above, receive a PO, then come back here to see it arrive.</p>`;
 document.querySelectorAll("tr[data-po]").forEach(tr=>tr.onclick=()=>openInternal(tr.dataset.po));
}

// ---------- Internal PO page: anyone at Tootsi can view and add documents ----------
const INT={"90201":[{cat:"Supplier packing list",name:"packing_list_90201.pdf",type:"application/pdf",by:"Purchasing",at:"Nov 20, 2026"}],
 "90203":[{cat:"Supplier loading report",name:"loading_report_90203.pdf",type:"application/pdf",by:"Purchasing",at:"Nov 21, 2026"}]};
const CATS=["Supplier packing list","Supplier loading report","Bill of lading","Certificate of analysis","QC report","NCR / claim","Photos","Other"];
let intCat=CATS[0],intWho="Juan (Inventory Control)";
function fileList(arr,emptyTxt){return arr.length?arr.map(f=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f3f3f0">
  ${f.url&&f.type?.startsWith("image")?`<img src="${f.url}" style="width:44px;height:44px;object-fit:cover;border-radius:6px">`:`<div style="width:44px;height:44px;border-radius:6px;background:#f3f3f0;display:grid;place-items:center">📄</div>`}
  <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500">${esc(f.cat||"")}</div><div style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}${f.by?" · "+esc(f.by):""}${f.at?" · "+esc(f.at):""}</div></div>
  ${f.url?`<a href="${f.url}" target="_blank" style="font-size:12px;color:var(--red)">Open</a>`:""}</div>`).join(""):`<div class="note">${emptyTxt}</div>`}
function openInternal(po){
 const p=POS.find(x=>x.po===po),s=SUB[po],docs=INT[po]||(INT[po]=[]);
 const tag=arr=>arr.map(f=>({...f}));
 const from3pl=s?[...tag(s.label).map(f=>({...f,cat:"Label photo"})),...tag(s.doc).map(f=>({...f,cat:"Receiving document"})),...tag(s.dmgPics).map(f=>({...f,cat:"Damage photo"}))]:[];
 if(s?.demo) from3pl.push({cat:"Label photo",name:"label_14015.jpg"},{cat:"Receiving document",name:"DL_receiving_90203.pdf"},{cat:"Damage photo",name:"damage_pallet7_1.jpg"},{cat:"Damage photo",name:"damage_pallet7_2.jpg"});
 $("drawer").innerHTML=`
 <div class="dh"><button class="close" id="x">×</button><div style="color:var(--muted);font-size:12px">Purchase order · internal view</div><h2 class="mono">PO ${p.po}</h2><div>${p.item} · ${esc(p.desc)}</div>
  <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${s?(s.damage?"p-dmg":"p-done"):"p-todo"}">${s?(s.damage?"Damage reported":"Received"):"Waiting for "+p.wh}</span></div></div>
 <div class="db">
  <div class="sec"><h3>PO details</h3><div class="grid2">
   <span class="k">3PL</span><span><b>${p.wh}</b></span>
   <span class="k">Supplier</span><span>${esc(p.supplier)}</span>
   <span class="k">Expected</span><span>${fd(p.eta)}</span>
   <span class="k">Pallets expected</span><span>${p.plt}</span>
   <span class="k">Shipment</span><span>${esc(p.load)}</span>
   <span class="k">Container</span><span class="mono">${p.cntr||"—"}</span>
  </div></div>
  <div class="sec"><h3>Internal only <span style="font-size:10px;background:var(--amber-soft);color:var(--amber);padding:2px 6px;border-radius:10px;text-transform:none;letter-spacing:0">never shown to 3PL</span></h3><div class="grid2">
   <span class="k">Allocation</span><span>${esc(p._private.alloc||"Not set")}</span>
   <span class="k">Total stock</span><span>${p._private.stock?p._private.stock.toLocaleString()+" lb":"—"}</span>
   <span class="k">Planning note</span><span>${esc(p._private.note||"—")}</span>
  </div></div>
  <div class="sec"><h3>From ${p.wh} (3PL receiving)</h3>
   ${s?`<div class="grid2" style="margin-bottom:10px"><span class="k">Received</span><span>${esc(s.recv)} · ${s.plt} plt · ${s.cs} cs</span><span class="k">Sent by</span><span>${esc(s.by)} · ${esc(s.at)}</span>
   ${s.damage?`<span class="k" style="color:var(--red)">Damage</span><span style="color:var(--red)">${esc(s.dmgText)}</span>`:""}</div>`:""}
   ${fileList(from3pl,`${p.wh} has not sent the receiving info yet.`)}
  </div>
  <div class="sec"><h3>Tootsi documents</h3>
   ${fileList(docs,"No documents yet. Add the first one below.")}
   <div class="step" style="margin-top:12px"><h4>Add a document</h4>
    <div class="row2" style="grid-template-columns:1fr 1fr">
     <div><label>Type</label><select class="in" id="i_cat">${CATS.map(c=>`<option ${c===intCat?"selected":""}>${c}</option>`).join("")}</select></div>
     <div><label>Your name / team</label><select class="in" id="i_who">${["Juan (Inventory Control)","Purchasing","Fulfillment","QC","Logistics","Receiving"].map(w=>`<option ${w===intWho?"selected":""}>${w}</option>`).join("")}</select></div>
    </div>
    <label class="drop" style="margin-top:10px"><input type="file" multiple id="i_file">📎 Choose files or take a photo</label>
    <p style="margin:8px 0 0">In the real app your name comes from your login automatically.</p>
   </div>
  </div>
 </div>`;
 $("drawer").classList.add("open");$("scrim").classList.add("open");
 $("x").onclick=closeD;
 $("i_cat").onchange=e=>intCat=e.target.value;
 $("i_who").onchange=e=>intWho=e.target.value;
 $("i_file").onchange=e=>{const at=new Date().toLocaleString("en-CA",{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});
  [...e.target.files].forEach(f=>docs.push({cat:intCat,name:f.name,type:f.type,url:URL.createObjectURL(f),by:intWho,at}));
  toast("Added to PO "+po+". Everyone at Tootsi can see it now.");render();openInternal(po)};
}
render();
</script>
</body>
</html>
